.mv{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;border-bottom:1px solid var(--gr)}

#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}

}

/* ===== CLIENTI ===== */
function listaContatti(){
 S.vista="contatti";if(S.unsub){S.unsub();S.unsub=null;}
 $("#top").innerHTML=`<div class="tb"><button class="ic" id="bMenu">${I.menu}</button><h2 style="flex:1;margin:0;font-weight:400;font-size:22px">Lista contatti</h2><button class="ic" id="cNew" aria-label="Nuovo contatto">${I.plus}</button></div>
  <div style="padding:0 12px 8px"><div class="fld"><input id="cQ" placeholder="Cerca un contatto.." autocomplete="off">${I.lens}</div></div>`;
 $("#bMenu").onclick=menuLaterale;$("#cNew").onclick=()=>formPren();
 $("#main").innerHTML=`<div class="vuoto">Scrivi nome, cognome o telefono</div>`;
 let tm;$("#cQ").oninput=x=>{clearTimeout(tm);tm=setTimeout(async()=>{const r=(await trova(x.target.value)).slice(0,40);const out=await Promise.all(r.map(async y=>({y,c:await getCliente(y.id)})));
  $("#main").innerHTML=out.length?`<div style="padding:0 12px">${out.map(({y,c})=>`<button class="li" data-c="${y.id}"><span><b>${esc(y.nome)}</b><small>${esc(c?.email||"")}<br>${esc(y.tel)}</small></span><span class="vis"><b style="background:var(--blu)">${c?.presenze||0}</b>${stIcona(c)}</span></button>`).join("")}</div>`:`<div class="vuoto">Nessun contatto trovato</div>`;
  $$("[data-c]").forEach(b=>b.onclick=()=>schedaCliente(b.dataset.c));},300);};
 setTimeout(()=>$("#cQ").focus(),50);
}
async function schedaCliente(id){
 S.cli.delete(id);const c=await getCliente(id);if(!c){toast("Cliente non trovato");return;}
 const nome=[c.nome,c.cognome].filter(Boolean).join(" ")||"Cliente";
 const f=document.createElement("div");f.className="full";$("#root").appendChild(f);let tab="info";
 const draw=async()=>{
  f.innerHTML=`<div class="fh"><button class="ic" data-x aria-label="Indietro">${I.back}</button><h2 style="text-align:left">${esc(nome)}</h2><button class="ic" id="sCall">📞</button></div>
  <div class="fb" style="padding-bottom:30px"><div style="text-align:center">${fiammelle(c)}</div>
   <div style="display:flex;gap:8px;margin:12px 0"><button class="btnb" id="sPren">+ Prenotazione</button><button class="btng" id="sChat">${I.send.replace(/22/g,"14")} Chat</button><button class="btnb" id="sPunti" style="margin-left:auto">⭐ Punti</button></div>
   <div class="kv"><span>📞 ${esc(c.telefono||"—")}</span></div><div class="kv"><span>✉️ ${esc(c.email||"—")}</span></div><div class="kv"><span>📅 Ultima visita: ${itData(c.ultimaPresenza)}</span></div>
   <div class="cnt"><div><b>${c.presenze||0}</b><small>Tot. interazioni</small></div><div><b>${c.annullate||0}</b><small>Cancellate</small></div><div><b>${c.noShow||0}</b><small>No Show</small></div><div><b>${c.puntiFidelity||0}</b><small>Punti fidelity</small></div></div>
   <div class="stabs">${[["info","Info"],["pren","Prenotazioni"],["fid","Fidelity"]].map(([k,t])=>`<button data-st="${k}" class="${tab===k?"on":""}">${t}</button>`).join("")}</div><div id="sBody" style="padding-top:10px">…</div></div>`;
  f.querySelector("[data-x]").onclick=()=>f.remove();
  $("#sCall").onclick=()=>{const t=telNorm(c.telefono);if(t)location.href="tel:+"+t;};
  $("#sPren").onclick=()=>{f.remove();formPren(null);setTimeout(()=>{},0);};$("#sChat").onclick=()=>wa(c.telefono,"");$("#sPunti").onclick=()=>caricaPunti(c,()=>{draw();});
  f.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{tab=b.dataset.st;draw();});
  const B=$("#sBody");
  if(tab==="info"){const k=c.consensi||{};
   B.innerHTML=`${[["privacy","Privacy"],["profilazione","Profilazione"],["marketing","Consenso Marketing"]].map(([x,t])=>`<div class="tg">${t}<button class="sw2 ${k[x]?"on":""}" data-cs="${x}"></button></div>`).join("")}
    <div class="sez">Tags</div><div>${(c.tags||[]).map(t=>`<span class="tagc">${esc(t)}</span>`).join("")||'<span style="color:var(--mute)">Nessun tag</span>'}</div>
    <div class="sez">Anagrafica</div><div class="kv"><span>Nome</span><b>${esc(c.nome||"")}</b></div><div class="kv"><span>Cognome</span><b>${esc(c.cognome||"")}</b></div><div class="kv"><span>Provincia</span><b>${esc(c.provincia||"—")}</b></div><div class="kv"><span>Data di nascita</span><b>${esc(c.dataNascita||"—")}</b></div><div class="kv"><span>Data di creazione</span><b>${itData(c.dataRegistrazione)}</b></div>`;
   B.querySelectorAll("[data-cs]").forEach(b=>b.onclick=async()=>{b.classList.toggle("on");const val=b.classList.contains("on");try{await setDoc(doc(db,"clienti",id),{consensi:{[b.dataset.cs]:val}},{merge:true});c.consensi={...k,[b.dataset.cs]:val};toast("Salvato");}catch(e){toast("Errore: "+e.code);}});}
  if(tab==="pren"){try{const s=await getDocs(query(collection(db,"prenotazioni"),where("clienteId","==",id),limit(60)));const l=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
   B.innerHTML=l.length?l.map(p=>`<button class="li" data-pp="${p.id}"><span><b>${esc(itData(p.data))} · ${esc(p.ora||"")}</b><small>${esc(p.persone)} persone${p.tavolo?" · tavolo "+esc(p.tavolo):""}</small></span><small>${esc(p.stato)}</small></button>`).join(""):`<div class="vuoto" style="padding:40px">Nessuna prenotazione</div>`;
   B.querySelectorAll("[data-pp]").forEach(b=>b.onclick=()=>formPren(l.find(x=>x.id===b.dataset.pp)));}catch(e){B.textContent="Errore: "+e.code;}}
  if(tab==="fid"){let mv=[];try{const s=await getDocs(query(collection(db,"clienti",id,"eventi"),orderBy("quando","desc"),limit(80)));mv=s.docs.map(d=>d.data()).filter(x=>x.tipo==="fidelity"||x.punti);}catch(e){}
   B.innerHTML=`<div class="fcard"><div style="flex:1"><div style="color:var(--mute);font-size:13px">📅 ${itData(c.dataRegistrazione)}</div><b style="font-size:17px">Principale</b><div>#${esc(c.tessera||id.slice(-4))}</div><div style="font-weight:800;font-size:18px;margin-top:10px">${c.puntiFidelity||0} punti</div></div></div>
    ${mv.map(m=>`<div class="mv"><span>${m.quando?.toDate?itData(iso(m.quando.toDate())):""}</span><b style="color:${m.punti<0?"var(--rosso)":"var(--verde)"}">${m.punti>0?"+":""}${m.punti||""}</b><span style="color:var(--mute)">${esc(m.da?"app mobile - "+m.da:"app mobile")}</span></div>`).join("")||'<div style="color:var(--mute);padding:10px 0">Nessun movimento</div>'}`;}
 };draw();
}
function caricaPunti(c,dopo){
 const nome=[c.nome,c.cognome].filter(Boolean).join(" ");let saldo=c.puntiFidelity||0,val=0;const premi=(S.cfg.premi||[]).slice().sort((a,b)=>a.punti-b.punti);
 const ov=dlg(`<h3 style="text-align:center;font-size:18px;font-weight:800">Fidelity: Principale<br>${esc(nome)}</h3>
  <div style="display:flex;gap:10px;align-items:center;justify-content:center"><button class="ic" id="kM" style="border:2px solid #555;border-radius:50%;width:32px;height:32px">−</button><input id="kV" type="number" inputmode="numeric" placeholder="Punti" style="width:110px;padding:14px;border:1px solid #9AA0AA;border-radius:6px;text-align:center"><button class="ic" id="kP" style="border:2px solid #555;border-radius:50%;width:32px;height:32px">+</button></div>
  <button class="bb" id="kGo" style="align-self:center;padding:10px 22px">Aggiorna saldo</button>
  <p style="margin-top:8px">Saldo punti attuale: <b id="kS">${saldo}</b><br>Puoi riscuotere uno di questi premi:</p>
  <div style="background:#fff;border-radius:6px"><div class="mv" style="font-weight:700;padding:10px"><span>Buono</span><span>Punti</span></div><div id="kPr"></div></div><button class="bb" data-k="x">Chiudi</button>`);
 const dp=()=>{$("#kS").textContent=saldo;$("#kPr").innerHTML=premi.map((p,i)=>`<div class="mv" style="padding:10px"><span>${esc(p.nome)}</span><span>${p.punti} ${saldo>=p.punti?`<button class="btnb" style="padding:4px 10px;margin-left:6px" data-r="${i}">Riscatta</button>`:""}</span></div>`).join("");
  ov.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>muovi(-premi[+b.dataset.r].punti,"Premio: "+premi[+b.dataset.r].nome));};
 const sync=()=>{$("#kV").value=val||"";};
 $("#kM").onclick=()=>{val=(+$("#kV").value||0)-1;sync();};$("#kP").onclick=()=>{val=(+$("#kV").value||0)+1;sync();};
 const muovi=async(delta,testo)=>{if(!delta)return;if(delta<0&&!confirm(testo+" ("+delta+" punti)?"))return;
  try{saldo=await runTransaction(db,async tx=>{const r=doc(db,"clienti",c.id),s=await tx.get(r),n=(s.data()?.puntiFidelity||0)+delta;if(n<0)throw new Error("Punti insufficienti");tx.update(r,{puntiFidelity:n,iscrittoFidelity:true});return n;});
   c.puntiFidelity=saldo;S.cli.delete(c.id);evento(c.id,"fidelity",`${testo} · saldo ${saldo}`,{punti:delta});val=0;sync();dp();
   toast("Saldo aggiornato: "+saldo,"Invia saldo WhatsApp",()=>wa(c.telefono,fill(S.cfg.msg.saldo,{nome:c.nome||"",punti:saldo})));dopo&&dopo();}catch(e){toast("Errore: "+(e.code||e.message));}};
 $("#kGo").onclick=()=>muovi(+$("#kV").value||0,"Carico punti");
 ov.onclick=e=>{if(e.target===ov||e.target.closest('[data-k="x"]'))ov.remove();};dp();
}

/* ===== menu, nav ===== */
function menuLaterale(){
 const ov=document.createElement("div");ov.className="ov";ov.style.zIndex=30;$("#root").appendChild(ov);
 const d=document.createElement("div");d.className="drawer";
 d.innerHTML=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><button class="ic" data-m="x">${I.back}</button><b style="font-size:17px">${esc(S.cfg.nomeLocale)}</b></div>
  <button class="opt" data-m="agenda">${I.cal} Agenda</button><button class="opt" data-m="contatti">${I.user} Lista contatti</button><button class="opt" data-m="sala">${I.tav} Sala (tablet)</button><button class="opt" data-m="classica">↺ Versione classica</button>
  <button class="opt" data-m="esci" style="margin-top:auto">${I.exit} Logout</button><div style="text-align:center;color:var(--mute);font-size:12px">Utente: ${esc(S.me.nome||"")}<br>Penelope</div>`;
 $("#root").appendChild(d);const close=()=>{ov.remove();d.remove();};ov.onclick=close;
 d.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const m=b.dataset.m;close();
  if(m==="agenda"){S.modo=null;agenda();}if(m==="contatti")listaContatti();if(m==="sala")location.href="sala.html";if(m==="classica")location.href="classica.html";if(m==="esci")signOut(auth);});
}
$$("nav button").forEach(b=>b.onclick=()=>{const n=b.dataset.n;
 if(n==="agenda"){S.modo=null;return agenda();}
 if(n==="nuovo"){const ov=foglio("Nuovo",`<button class="opt" data-k="p">${I.cal} Prenotazione</button><button class="opt" data-k="f">${I.hour} Filafast</button><button class="opt" data-k="c">${I.user} Contatto</button>`);
  ov.querySelectorAll("[data-k]").forEach(x=>x.onclick=()=>{ov.remove();const k=x.dataset.k;if(k==="p")formPren();if(k==="f")formPren(null,{},true);if(k==="c")listaContatti();});
  if(S.vista==="agenda"&&S.sub==="fila"){ov.remove();formPren(null,{},true);}return;}
 toast({ordini:"Ordini asporto/delivery: in arrivo",chiamate:"Chiamate: in arrivo",messaggi:"Le chat si aprono in WhatsApp dalla card (scorri a sinistra)"}[n]);
});
</script>
