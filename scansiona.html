<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penelope · Scansiona coupon</title><meta name="theme-color" content="#14233A"><link rel="icon" href="icona-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#14233A;--gold:#D9B26A;--line:#E3E6EB;--mute:#6B7280;--red:#E5484D;--green:#2DBE60;--bg:#F4F5F7}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--navy);font-family:Inter,system-ui,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit;font-size:16px;color:inherit}
.hidden{display:none!important}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px}.top b{letter-spacing:1px}.top .sp{flex:1}.top button{background:none;border:0;color:#C9D2E0;font-weight:600}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.btn{width:100%;min-height:52px;border:0;border-radius:12px;font-weight:800;background:var(--navy);color:#fff;font-size:17px}
.btn.v{background:var(--green)}.btn.g{background:#fff;color:var(--navy);border:1.5px solid #CBD0D8}.btn.r{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn:disabled{opacity:.5}
.f{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px;background:#fff}
label.l{display:block;font-weight:700;font-size:13px;margin:12px 0 6px;color:#4B5160}
#vw{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:1/1}
#vw video{width:100%;height:100%;object-fit:cover;display:block}
#vw .mir{position:absolute;inset:18%;border:4px solid var(--gold);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.esito{border-radius:16px;padding:18px;text-align:center;color:#fff;margin-bottom:12px}
.esito.ok{background:var(--green)}.esito.ko{background:var(--red)}.esito.info{background:var(--navy)}
.esito h2{margin:4px 0;font-size:24px}.esito .big{font-size:46px;line-height:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.muted{color:var(--mute);font-size:13px}
.lst button{display:block;width:100%;text-align:left;background:#F7F8FA;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:20px}
#login form{background:#fff;padding:26px;border-radius:18px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>
<div id="login" class="hidden"><form id="lf"><h2 style="margin:0;text-align:center">PENELOPE</h2><div class="muted" style="text-align:center">Scansione coupon</div><input class="f" id="lem" type="email" placeholder="Email" required><input class="f" id="lpw" type="password" placeholder="Password" required><button class="btn">Entra</button><div id="lerr" style="color:var(--red);text-align:center;font-weight:600"></div></form></div>
<div id="app" class="hidden">
 <div class="top"><b>🎟️ COUPON</b><span class="sp"></span><span id="chi" class="muted" style="color:#C9D2E0"></span><button id="esci">Esci</button></div>
 <main>
  <div id="esito"></div>
  <div id="scan" class="card"><div id="vw"><video id="vid" playsinline muted></video><div class="mir"></div></div>
   <div class="muted" style="text-align:center;margin-top:8px" id="cst">Inquadra il QR del cliente</div></div>
  <div class="card"><b>Senza QR?</b><label class="l">Cellulare del cliente</label><div style="display:flex;gap:8px"><input class="f" id="mt" type="tel" inputmode="tel" placeholder="333 123 4567"><button class="btn" style="width:auto;padding:0 18px" id="mc">Cerca</button></div><div class="lst" id="ml"></div></div>
 </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, collection, query, where, runTransaction, serverTimestamp, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBzpnM1H7Nk99bGqiKoFvJfZfUEhxYt1yI",authDomain:"galleon-club.firebaseapp.com",projectId:"galleon-club",storageBucket:"galleon-club.firebasestorage.app",messagingSenderId:"256580919264",appId:"1:256580919264:web:1639030e273fae781fd585"});
const auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0"),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const itD=s=>s?`${s.slice(8,10)}/${s.slice(5,7)}/${s.slice(0,4)}`:"—";
const GG=["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
let ME=null,stream=null,busy=false;

$("#lf").onsubmit=async e=>{e.preventDefault();$("#lerr").textContent="";try{await signInWithEmailAndPassword(auth,$("#lem").value,$("#lpw").value);}catch(x){$("#lerr").textContent="Email o password errate";}};
$("#esci").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
 if(!u){ferma();$("#login").classList.remove("hidden");$("#app").classList.add("hidden");return;}
 const sd=await getDoc(doc(db,"staff",u.uid)).catch(()=>null);if(!sd||!sd.exists()){$("#lerr").textContent="Account non abilitato.";signOut(auth);return;}
 ME={uid:u.uid,...sd.data()};$("#chi").textContent=ME.nome||"";$("#login").classList.add("hidden");$("#app").classList.remove("hidden");avviaCam();
});

/* fotocamera */
const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
const det=("BarcodeDetector" in window)?new BarcodeDetector({formats:["qr_code"]}):null;
async function avviaCam(){
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});const v=$("#vid");v.srcObject=stream;await v.play();$("#cst").textContent="Inquadra il QR del cliente";requestAnimationFrame(giro);}
 catch(e){$("#cst").innerHTML="Fotocamera non disponibile: consenti l'accesso alla fotocamera oppure cerca col cellulare qui sotto.";}
}
function ferma(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}
let ultimo=0;
async function giro(){
 if(!stream)return;const v=$("#vid");
 if(!busy&&v.readyState>=2&&Date.now()-ultimo>250){ultimo=Date.now();let txt=null;
  try{if(det){const r=await det.detect(v);if(r[0])txt=r[0].rawValue;}
   else if(window.jsQR){const w=Math.min(640,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);const r=jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:"dontInvert"});if(r)txt=r.data;}}catch(e){}
  if(txt)leggi(txt);}
 requestAnimationFrame(giro);
}

/* lettura e verifica */
const vibra=n=>{try{navigator.vibrate&&navigator.vibrate(n);}catch(e){}};
function esito(tipo,html){$("#esito").innerHTML=`<div class="esito ${tipo}">${html}</div>`;window.scrollTo({top:0,behavior:"smooth"});}
async function leggi(txt){
 const m=/^GALLEON:([A-Za-z0-9_-]+):([A-Z0-9]{6})$/.exec(txt.trim());
 if(!m){vibra([80,60,80]);esito("ko",`<div class="big">✖</div><h2>QR non riconosciuto</h2><div>Non è un coupon del The Galleon</div>`);return;}
 busy=true;await apri(m[1],m[2]);
}
function valida(c,p){
 const oggi=iso(new Date()),g=new Date().getDay();
 if(c.stato==="usato")return `Già usato il ${c.usatoIl?.toDate?c.usatoIl.toDate().toLocaleDateString("it-IT"):""}${c.usatoDa?" da "+c.usatoDa:""}`;
 if(c.stato==="annullato")return "Coupon annullato";
 if(!p)return "La promozione è stata eliminata";
 if(p.attiva===false)return "La promozione è disattivata";
 if(p.dal&&oggi<p.dal)return "Promo valida dal "+itD(p.dal);
 if(c.scadenza&&oggi>c.scadenza)return "Coupon scaduto il "+itD(c.scadenza);
 if(p.al&&oggi>p.al)return "Promo scaduta il "+itD(p.al);
 if(p.giorni?.length&&!p.giorni.includes(g))return "Non valida di "+GG[g]+" (solo "+p.giorni.map(x=>GG[x]).join(", ")+")";
 return null;
}
async function apri(id,k){
 try{
  const cs=await getDoc(doc(db,"coupon",id));
  if(!cs.exists()||(k&&cs.data().k!==k)){vibra([80,60,80]);esito("ko",`<div class="big">✖</div><h2>Coupon non valido</h2>`);busy=false;return;}
  const c=cs.data(),ps=await getDoc(doc(db,"promo",c.promoId)),p=ps.exists()?ps.data():null,no=valida(c,p);
  if(no){vibra([80,60,80]);esito("ko",`<div class="big">✖</div><h2>${esc(c.titolo)}</h2><div><b>${esc(no)}</b></div><div style="margin-top:6px">${esc(c.nome)} · ${esc(c.telefono)}</div><button class="btn g" style="margin-top:14px" id="ok2">Chiudi</button>`);$("#ok2").onclick=()=>{$("#esito").innerHTML="";busy=false;};return;}
  vibra(120);
  esito("info",`<div class="big">🎟️</div><h2>${esc(c.titolo)}</h2><div>${esc(c.nome)} · ${esc(c.telefono)}</div>${p.minPersone>1?`<div style="margin-top:6px"><b>Minimo ${p.minPersone} persone</b></div>`:""}
   <div style="background:#fff;color:var(--navy);border-radius:12px;padding:12px;margin-top:14px;text-align:left">
    <div class="g2"><div><label class="l">Persone al tavolo</label><input class="f" id="ep" type="number" inputmode="numeric" min="1" value="${p.minPersone||""}"></div><div><label class="l">Conto € (facoltativo)</label><input class="f" id="es" type="number" inputmode="decimal" step="0.5" min="0"></div></div>
    <div class="g2" style="margin-top:12px"><button class="btn g" id="eno">Annulla</button><button class="btn v" id="esi">✔ Usa coupon</button></div></div>`);
  $("#eno").onclick=()=>{$("#esito").innerHTML="";busy=false;};
  $("#esi").onclick=()=>brucia(id,p);
 }catch(e){esito("ko",`<h2>Errore</h2><div>${esc(e.code||e.message)}</div>`);busy=false;}
}
async function brucia(id,p){
 const pers=Number($("#ep").value)||null,spesa=Number(String($("#es").value).replace(",","."))||null;
 if(p.minPersone>1&&pers&&pers<p.minPersone&&!confirm(`La promo richiede minimo ${p.minPersone} persone. Usarla lo stesso?`))return;
 $("#esi").disabled=true;
 try{
  const c=await runTransaction(db,async tx=>{
   const r=doc(db,"coupon",id),s=await tx.get(r);if(!s.exists())throw new Error("Coupon non trovato");const c=s.data();
   if(c.stato!=="emesso")throw new Error("Coupon già usato");
   const tel=c.telefono.replace(/\D/g,""),cr=doc(db,"clienti","t"+tel),cl=await tx.get(cr);
   tx.update(r,{stato:"usato",usatoIl:serverTimestamp(),usatoDa:ME.nome||ME.uid,usatoDaUid:ME.uid,persone:pers,spesa});
   const tags=["Promo usata","Promo: "+c.titolo];const d={tags:arrayUnion(...tags),ultimaPromo:iso(new Date())};
   const cons=c.consensi||{};const log={data:iso(new Date()),fonte:"coupon "+c.titolo,versione:cons.versione||"",marketing:!!cons.marketing,profilazione:!!cons.profilazione};
   if(!cl.exists())Object.assign(d,{nome:c.nome,cognome:"",telefono:c.telefono,email:c.email||null,presenze:0,puntiFidelity:0,dataRegistrazione:iso(new Date()),provenienza:"promo",origine:"coupon",consensi:{privacy:true,marketing:!!cons.marketing,profilazione:!!cons.profilazione},consensiLog:[log]});
   else{const up={};if(cons.marketing)up["consensi.marketing"]=true;if(cons.profilazione)up["consensi.profilazione"]=true;if(Object.keys(up).length){Object.assign(d,up);d.consensiLog=arrayUnion(log);}if(!cl.data().email&&c.email)d.email=c.email;}
   if(cl.exists())tx.update(cr,d);else tx.set(cr,d);
   return c;
  });
  vibra([60,40,160]);esito("ok",`<div class="big">✔</div><h2>Coupon usato</h2><div>${esc(c.titolo)}</div><div>${esc(c.nome)}</div><button class="btn g" style="margin-top:14px" id="ok3">Prossimo</button>`);
  $("#ok3").onclick=()=>{$("#esito").innerHTML="";busy=false;};setTimeout(()=>{if($("#ok3")){$("#esito").innerHTML="";busy=false;}},6000);
 }catch(e){esito("ko",`<div class="big">✖</div><h2>${esc(e.message||e.code)}</h2><button class="btn g" style="margin-top:14px" id="ok4">Chiudi</button>`);$("#ok4").onclick=()=>{$("#esito").innerHTML="";busy=false;};}
}

/* ricerca manuale */
$("#mc").onclick=async()=>{
 let t=$("#mt").value.replace(/\D/g,"").replace(/^0039|^39(?=3\d{8,9}$)/,"");if(!/^3\d{8,9}$/.test(t)){$("#ml").innerHTML=`<div class="muted" style="margin-top:8px">Numero non valido</div>`;return;}
 const s=await getDocs(query(collection(db,"coupon"),where("telefono","==","+39"+t))).catch(e=>null);
 const l=s?s.docs.map(d=>({id:d.id,...d.data()})):[];
 $("#ml").innerHTML=l.length?l.map(c=>`<button data-c="${esc(c.id)}"><b>${esc(c.titolo)}</b><div class="muted">${esc(c.nome)} · ${c.stato==="emesso"?"da usare":c.stato} · scade ${itD(c.scadenza)}</div></button>`).join(""):`<div class="muted" style="margin-top:8px">Nessun coupon per questo numero</div>`;
 document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{busy=true;apri(b.dataset.c,null);});
};
</script>
</body>
</html>
