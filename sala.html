<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="manifest" href="sala.webmanifest"><link rel="icon" href="icona-192.png"><meta name="mobile-web-app-capable" content="yes">

<title>Penelope · Sala</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#14233A;--gold:#D9B26A;--bg:#F4F5F7;--line:#E3E6EB;--mute:#6B7280;--red:#E5484D;--blue:#2F80ED;--cyan:#1EC8F0;--purple:#9B6BDB;--y1:#FFE070;--y2:#F7A600;--y3:#F05454;--free:#2DBE60}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--navy);font-family:Inter,system-ui,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select{font-family:inherit;font-size:15px;color:inherit}button{cursor:pointer}
.hidden{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:20px}
#login form{background:#fff;border-radius:18px;padding:26px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px}
.f{width:100%;min-height:46px;border:1.5px solid #CBD0D8;border-radius:10px;padding:8px 12px;background:#fff}
.btn{min-height:44px;border:0;border-radius:10px;padding:0 16px;font-weight:700;background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);color:var(--navy)}.btn.light{background:#fff;color:var(--navy);border:1.5px solid #CBD0D8}.btn.red{background:#fff;color:var(--red);border:1.5px solid var(--red)}.btn.green{background:var(--free);color:#fff}
#app{height:100vh;display:grid;grid-template-rows:auto auto auto 1fr auto}
/* barra alta */
.top{background:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:3px solid var(--navy)}
.logo{font-weight:800;letter-spacing:1px;font-size:20px;display:flex;align-items:center;gap:8px;white-space:nowrap}.logo i{width:30px;height:30px;border-radius:8px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:15px}
.days{display:flex;gap:6px;flex:1;overflow-x:auto;justify-content:center}
.day{min-width:58px;border:0;background:#F1F2F4;border-radius:8px;padding:4px 6px;text-align:center;line-height:1.1;font-size:11px;color:var(--mute)}.day b{display:block;font-size:20px;color:var(--navy)}.day.on{background:var(--navy);color:var(--gold)}.day.on b{color:#fff}.day.oggi:not(.on){box-shadow:inset 0 0 0 2px var(--gold)}
.ib{width:42px;height:42px;border-radius:10px;border:0;background:transparent;font-size:21px;position:relative;display:flex;align-items:center;justify-content:center;color:var(--navy)}.ib:hover{background:#F1F2F4}
.ib.plus{font-size:30px;color:var(--blue);font-weight:300}
.bdg{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--y2);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
/* schede */
.tabs{background:#fff;display:flex;justify-content:center;gap:6px;border-bottom:1px solid var(--line);position:relative}
.tabs button{border:0;background:none;padding:12px 18px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent}.tabs button.on{color:var(--navy);border-bottom-color:var(--gold)}
#tSet{position:absolute;left:10px;top:4px}
/* strumenti */
.tools{background:#fff;display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.seg{display:flex;background:#F1F2F4;border-radius:10px;padding:3px}.seg button{border:0;background:none;border-radius:8px;padding:6px 10px;font-size:16px;position:relative}.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}.seg small{position:absolute;top:-4px;right:-4px;background:var(--blue);color:#fff;border-radius:8px;font-size:10px;padding:0 4px;font-weight:700}
#cerca{min-height:38px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;width:170px}
.caps{display:flex;gap:6px;align-items:center;border:2px solid var(--navy);border-radius:22px;padding:3px 6px;white-space:nowrap;margin-left:auto}
.caps>b{padding:0 6px;font-size:16px}.caps>b .r{color:var(--red)}
.chip{border:2px solid var(--c,#999);border-radius:18px;background:#fff;padding:3px 10px;font-size:12px;font-weight:600;display:flex;gap:8px;align-items:center}.chip.on{background:var(--c);color:#fff}.chip .n{font-weight:800}
/* corpo */
.main{min-height:0;display:grid;grid-template-columns:1fr}
.main.side{grid-template-columns:290px 1fr}
.scroll{overflow:auto;min-height:0}
/* lista */
table{width:100%;border-collapse:collapse;background:#fff}
th{position:sticky;top:0;background:#FAFBFC;font-size:12px;color:var(--mute);text-align:left;padding:8px;border-bottom:1px solid var(--line);font-weight:600;z-index:1}
td{padding:7px 8px;border-bottom:1px solid #EEF0F3;vertical-align:middle}
tr.web td{background:#FFF0F3}tr.chiusa td{color:#9AA1AC}tr.chiusa .nm{text-decoration:line-through;text-decoration-color:var(--red)}
.stc{width:24px;height:24px;border-radius:50%;border:2px solid #7C8595;background:#fff;display:block}.stc.y{background:var(--y1);border-color:#C9A100}.stc.a{background:var(--blue);border-color:var(--blue)}.stc.ff{background:var(--purple);border-color:var(--purple)}.stc.n{background:#fff;border-color:var(--red)}
.pax{font-weight:800;color:var(--blue);font-size:17px}
.nm{font-weight:700;cursor:pointer}.sub{font-size:12px;color:var(--mute)}
.nota{display:inline-block;margin-top:2px;background:#FFF6D6;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:600;color:#6A4D00}
.vis{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:13px;font-size:12px;font-weight:800;background:var(--y1);padding:0 5px}.vis.k{background:#111;color:#fff}.vis.n{background:#E6F4EA;color:#1E7E34}
.sala{display:inline-block;border-radius:8px;padding:4px 10px;color:#fff;font-size:12px;font-weight:700;min-width:70px;text-align:center}
.ic{border:0;background:none;font-size:19px;padding:4px 6px;border-radius:8px}.ic:hover{background:#F1F2F4}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--red);display:inline-flex;align-items:center;justify-content:center;font-size:14px}.ck.ok{border-color:var(--free);color:var(--free)}
.banner{background:#FFD48A;padding:10px 14px;display:flex;align-items:center;gap:14px;font-weight:700}.banner span{font-weight:500;margin-left:auto}.banner button{border:0;background:none;font-size:22px;color:var(--red)}
.vuoto{padding:40px;text-align:center;color:var(--mute)}
.acc{display:flex;gap:6px}.acc button{min-height:32px;border-radius:8px;border:0;padding:0 10px;font-weight:700}.acc .si{background:var(--free);color:#fff}.acc .no{background:#fff;border:1.5px solid var(--red);color:var(--red)}
/* pannello laterale */
aside{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ptabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px}
.ptabs button{border:0;background:#F1F2F4;border-radius:8px;padding:6px 2px;font-size:11px;font-weight:600;line-height:1.15;position:relative}.ptabs button.on{background:var(--navy);color:#fff}
.ptabs small{position:absolute;top:-6px;left:-4px;background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px}
.plist{overflow:auto;flex:1;padding:0 8px 8px;display:flex;flex-direction:column;gap:6px}
.bk{border:1px solid var(--line);border-left:5px solid var(--y1);border-radius:10px;padding:8px 10px;touch-action:none;user-select:none;cursor:grab;background:#fff;display:flex;gap:8px;align-items:center}
.bk.a{border-left-color:var(--blue)}.bk.ff{border-left-color:var(--purple)}.bk.w{border-left-color:var(--y3);background:#FFF5F6}
.bk b{display:block}.bk small{color:var(--mute);font-size:12px}.bk .o{margin-left:auto;text-align:right;font-weight:700}
.bk .warn{color:var(--red);font-weight:800}
.drop.over{outline:3px dashed var(--gold);outline-offset:-3px}
/* piantina */
.planw{overflow:auto;padding:14px;min-height:0}
.plan{position:relative;width:100%;min-width:760px;aspect-ratio:16/10;background:#DFE2E7;border-radius:12px}
.tav{position:absolute;touch-action:none;user-select:none;display:flex;align-items:center;justify-content:center}
.tav .tb{position:absolute;inset:6%;border-radius:8px;border:2px solid #4B5563;background:var(--free);box-shadow:0 2px 5px rgba(0,0,0,.2)}
.tav.tondo .tb{border-radius:50%}.tav.rombo .tb{transform:rotate(45deg);inset:16%}
.tav .lb{position:relative;text-align:center;line-height:1.05;pointer-events:none}.tav .lb b{display:block;font-size:15px}.tav .lb small{font-size:10px}
.tav .nb{position:absolute;top:-2px;left:-2px;background:var(--red);color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:2}
.tav .od{position:absolute;top:0;right:0;width:14px;height:14px;border-radius:50%;background:var(--red);border:2px solid #fff;z-index:2}
.tav.over .tb{box-shadow:0 0 0 4px var(--gold)}
.edit .tav .tb{border-style:dashed;cursor:move}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:10px}.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:5px;vertical-align:-2px;border:1px solid #4B5563}
.ghost{position:fixed;z-index:80;pointer-events:none;background:var(--navy);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;transform:translate(-50%,-80%)}
/* planning */
.pg{min-width:1100px;background:#fff;position:relative}
.prow{display:flex;border-bottom:1px solid #EEF0F3;min-height:38px}.prow .tn{width:90px;flex-shrink:0;padding:6px 8px;font-weight:700;border-right:1px solid var(--line);color:#fff;font-size:13px}
.prow .tr{position:relative;flex:1}
.phead{display:flex;position:sticky;top:0;background:#FAFBFC;z-index:3;border-bottom:1px solid var(--line)}.phead .tn{width:90px;flex-shrink:0}.phead .tr{position:relative;flex:1;height:28px}.phead span{position:absolute;font-size:11px;color:var(--mute);top:7px;transform:translateX(-50%)}
.grid{position:absolute;top:0;bottom:0;border-left:1px dashed #E8EAEE}
.blk{position:absolute;top:4px;bottom:4px;border-radius:7px;padding:2px 6px;font-size:11px;line-height:1.2;overflow:hidden;white-space:nowrap;background:var(--y1);border:1px solid #C9A100;touch-action:none;cursor:grab}
.blk.a{background:#CFE2FF;border-color:var(--blue)}.blk.ff{background:#E6DAF7;border-color:var(--purple)}.blk.w{background:#C9F2FC;border-color:var(--cyan)}.blk.l{background:#EEE;border-color:#BBB;color:#888}
.blk b{display:block}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:2}
.prow.over{background:#FFF8E6}
/* arrivi */
.arr{padding:16px}.bars{display:flex;align-items:flex-end;gap:6px;height:220px;background:#fff;border-radius:12px;padding:14px 14px 0;overflow-x:auto}
.bar{flex:1;min-width:36px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;border-radius:8px 8px 0 0}
.bar.on{background:#FFF6DE}.bar i{display:block;width:70%;border-radius:6px 6px 0 0;background:var(--y2)}.bar i.a{background:var(--blue)}.bar b{font-size:12px}.bar span{font-size:11px;color:var(--mute);padding:4px 0}
/* mese */
.mese{padding:16px}.mh{display:flex;align-items:center;gap:12px;margin-bottom:10px}.mh h2{margin:0;text-transform:capitalize}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.mg .h{text-align:center;font-size:12px;color:var(--mute);font-weight:600}
.cel{background:#fff;border-radius:10px;min-height:86px;padding:8px;border:2px solid transparent;cursor:pointer;display:flex;flex-direction:column}.cel.on{border-color:var(--navy)}.cel.oggi{border-color:var(--gold)}.cel.fuori{opacity:.35}
.cel .d{font-weight:800}.cel .p{margin-top:auto;font-size:13px}.cel .p b{font-size:18px;color:var(--blue)}.cel .bg{height:5px;border-radius:3px;background:#F1F2F4;margin-top:4px;overflow:hidden}.cel .bg i{display:block;height:5px;background:var(--y2)}
/* barra bassa */
.bot{background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:40px;padding:6px}
.bot button{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mute);position:relative;padding:2px 14px}.bot button b{font-size:21px}.bot button.on{color:var(--red)}.bot .bdg{right:2px}
/* fogli */
.sheet-bg{position:fixed;inset:0;background:rgba(11,21,34,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:#fff;border-radius:16px;max-width:470px;width:100%;padding:18px;display:flex;flex-direction:column;gap:10px;max-height:92vh;overflow:auto}
.sheet h2{margin:0;font-size:20px}.sheet p{margin:0;color:var(--mute)}
.ln{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px}.ln b{flex:1}.ln .late{color:var(--red);font-weight:700}
#embed{position:fixed;inset:0;z-index:70;background:rgba(11,21,34,.45);display:flex;justify-content:center}
#embed iframe{width:100%;max-width:720px;height:100%;border:0;background:#F3F4F6}
.menu{position:fixed;top:0;right:0;bottom:0;width:300px;background:#fff;z-index:65;box-shadow:-8px 0 30px rgba(0,0,0,.2);padding:18px;display:flex;flex-direction:column;gap:6px}
.menu button,.menu a{border:0;background:#F6F7F9;border-radius:10px;padding:12px;text-align:left;font-weight:600;text-decoration:none;color:var(--navy);font-size:15px}
.muted{color:var(--mute);font-size:13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;z-index:90;font-weight:600}
#editbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
@media print{.top,.tabs,.tools,.bot,aside{display:none!important}#app{display:block;height:auto}.scroll{overflow:visible}}
</style>
</head>
<body>
<div id="login" class="hidden">
  <form id="lf"><div style="font-weight:800;color:var(--gold);letter-spacing:2px;font-size:12px">THE GALLEON</div><div style="font-size:28px;font-weight:800">Penelope · Sala</div>
    <label for="lem">Email</label><input class="f" id="lem" type="email" autocomplete="username" required>
    <label for="lpw">Password</label><input class="f" id="lpw" type="password" autocomplete="current-password" required>

</div>

    <div class="days" id="days"></div>
    <button class="ib" id="cal" title="Scegli il giorno">📅</button><input type="date" id="calI" style="position:absolute;opacity:0;pointer-events:none;width:1px">
    <button class="ib" id="sync" title="Collegamento">☁️</button>

  </div>

  <div class="tools" id="tools"></div>

</div>
<div id="sheetRoot"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, updateDoc, setDoc, deleteDoc, addDoc, collection, query, where, onSnapshot, serverTimestamp, writeBatch, increment, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBzpnM1H7Nk99bGqiKoFvJfZfUEhxYt1yI",authDomain:"galleon-club.firebaseapp.com",projectId:"galleon-club",storageBucket:"galleon-club.firebasestorage.app",messagingSenderId:"256580919264",appId:"1:256580919264:web:1639030e273fae781fd585"});
const auth=getAuth(app), db=getFirestore(app);
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0"), iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, D=s=>new Date(s+"T12:00:00");
const GS=["Dom","Lun","Mar","Mer","Gio","Ven","Sab"], MM=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const bello=s=>{const d=D(s);return `${GS[d.getDay()]} ${d.getDate()} ${MM[d.getMonth()]}`;};
const mi=h=>{const [a,b]=String(h||"0:0").split(":");return (+a||0)*60+(+b||0);}, hm=m=>`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
const adesso=()=>{const n=new Date();return n.getHours()*60+n.getMinutes();};
const toast=m=>{const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);};
const telNorm=t=>{let x=String(t||"").replace(/\D/g,"");if(x.startsWith("00"))x=x.slice(2);if(x.length===10&&x.startsWith("3"))x="39"+x;return x.length>=8?x:"";};
const wa=(tel,msg)=>{const x=telNorm(tel);if(!x)return toast("Numero di telefono mancante");window.open(`https://wa.me/${x}?text=${encodeURIComponent(msg)}`,"_blank");};
const MSG={conferma:"Ciao {nome}! La tua prenotazione al {locale} è confermata: {giorno} alle {ora}, {persone} persone. Ti aspettiamo!",rifiutata:"Ciao {nome}, purtroppo per {giorno} alle {ora} non abbiamo più posto. Speriamo di vederti presto al {locale}!"};
const fill=(t,o)=>String(t||"").replace(/\{(\w+)\}/g,(_,k)=>(k==="locale"?S.cfg.nomeLocale||"The Galleon":o[k])??"");
const PAL=["#8BC34A","#F5A000","#7A1F8C","#2F80ED","#E5484D","#1EC8F0","#6D4C41"];

const S={cfg:{},sale:[],data:iso(new Date()),tab:"lista",vista:"agenda",turno:"tutti",sala:"",filtroSala:"",cerca:"",ptab:"da",chiuse:false,edit:false,slot:null,
  tav:[],pren:[],cli:new Map(),rich:[],me:null,u2:null,mese:null,mc:{}};
const colSala=s=>S.cfg.salaColori?.[s]||PAL[Math.max(0,S.sale.indexOf(s))%PAL.length];
const tavDi=p=>p.tavoli&&p.tavoli.length?p.tavoli:(p.tavolo?String(p.tavolo).split(" + ").filter(Boolean):[]);
const salaTav=n=>S.tav.find(t=>t.nome===n)?.sala;
const salaP=p=>p.sala||salaTav(tavDi(p)[0])||"";
const ordNome=(a,b)=>String(a.nome).localeCompare(String(b.nome),undefined,{numeric:true});
const durata=p=>+p.durata||+S.cfg.durataStd||90;

const ATT=["confermata","attesa"], CH=["arrivato","noshow"];

const oggi=()=>S.data===iso(new Date());
const inTurno=p=>S.turno==="tutti"||turnoDi(p)===S.turno;
const tipo=p=>p.walkin?"w":p.fila?"f":"";

/* ---------- accesso e dati ---------- */
$("#lf").onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$("#lem").value.trim(),$("#lpw").value);$("#lpw").value="";}catch(x){$("#lerr").textContent="Email o password non corretti.";}};
onAuthStateChanged(auth,async u=>{
  if(!u){$("#login").classList.remove("hidden");$("#app").classList.add("hidden");return;}
  const sd=await getDoc(doc(db,"staff",u.uid)).catch(()=>null);
  if(!sd||!sd.exists()){$("#lerr").textContent="Account non abilitato.";signOut(auth);return;}

    const trova=(x,y)=>{const t=document.elementFromPoint(x,y);return t?.closest(".tav")||t?.closest(".prow[data-tn]")||t?.closest(".drop");};

      if(!g){g=document.createElement("div");g.className="ghost";g.textContent=`${p.nome||""} · ${p.persone}`;document.body.appendChild(g);}
      g.style.left=ev.clientX+"px";g.style.top=ev.clientY+"px";const z=trova(ev.clientX,ev.clientY);if(z!==over){over?.classList.remove("over");over=z;over?.classList.add("over");} };
    const up=ev=>{ window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);g?.remove();over?.classList.remove("over");
      if(!moved){ return p.stato==="richiesta"?accettaChiedi(p):apriScheda(p); }
      const z=trova(ev.clientX,ev.clientY); if(!z) return;
      const tav=z.classList.contains("tav")?S.tav.find(x=>x.id===z.dataset.t):z.dataset.tn?S.tav.find(x=>x.nome===z.dataset.tn):null;
      if(tav){ if(p.stato==="richiesta") return toast("Prima accetta la richiesta"); const cur=tavDi(p); if(cur.includes(tav.nome)) return;
        if(cur.length) scegli(`${p.nome}: spostare o unire?`,[[`Sposta al tavolo ${tav.nome}`,()=>setTav(p,[tav.nome],tav.sala)],[`Unisci (${cur.join(" + ")} + ${tav.nome})`,()=>setTav(p,[...cur,tav.nome],tav.sala)]]);
        else setTav(p,[tav.nome],tav.sala);
        const occ=S.pren.filter(x=>x.id!==p.id&&vivo(x)&&tavDi(x).includes(tav.nome)&&Math.abs(mi(x.ora)-mi(p.ora))<Math.max(durata(x),durata(p)));
        if(occ.length) toast(`Attenzione: al ${tav.nome} c'è già ${occ.map(x=>x.nome).join(", ")} alla stessa ora`);
        else if(+tav.posti&&+p.persone>+tav.posti&&!cur.length) toast(`${p.persone} persone, il tavolo ${tav.nome} ha ${tav.posti} posti`);
      } else if(z.classList.contains("drop")&&tavDi(p).length) setTav(p,[],null); };
    window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up); }; }

/* ---------- PLANNING ---------- */
function vPlanning(m){
  const pn=pannello(); m.className="main side";
  const vis=S.pren.filter(p=>(vivo(p)||(p.stato==="arrivato"&&p.liberato))&&inTurno(p));
  let a=S.turno==="pranzo"?11*60:S.turno==="cena"?18*60:11*60, b=S.turno==="pranzo"?16*60:24*60;
  vis.forEach(p=>{a=Math.min(a,Math.floor(mi(p.ora)/60)*60);b=Math.max(b,Math.ceil((mi(p.ora)+durata(p))/60)*60);}); const span=b-a, X=v=>((v-a)/span*100).toFixed(3)+"%";
  const tv=S.tav.filter(t=>t.sala===S.sala).sort(ordNome);
  let ore="",gr=""; for(let v=a;v<=b;v+=30){ if(v%60===0) ore+=`<span style="left:${X(v)}">${hm(v)}</span>`; gr+=`<div class="grid" style="left:${X(v)}"></div>`; }
  const now=oggi()&&adesso()>=a&&adesso()<=b?`<div class="now" style="left:${X(adesso())}"></div>`:"";
  const blk=p=>`<div class="blk ${p.liberato?"l":p.stato==="arrivato"?(p.walkin?"w":p.fila?"ff":"a"):p.stato==="attesa"?"ff":""}" data-bk="${p.id}" style="left:${X(mi(p.ora))};width:calc(${(durata(p)/span*100).toFixed(3)}% - 2px)"><b>P.${esc(p.persone)} - ${esc(p.ora)}</b>${esc(p.nome||"")}</div>`;
  m.innerHTML=pn.html+`<div class="scroll"><div class="pg"><div class="phead"><div class="tn"></div><div class="tr">${ore}</div></div>
   ${tv.map(t=>`<div class="prow" data-tn="${esc(t.nome)}"><div class="tn" style="background:${colSala(t.sala)}">${esc(t.nome)}<br><small style="font-weight:500">Pax ${esc(t.posti||"")}</small></div><div class="tr">${gr}${now}${vis.filter(p=>tavDi(p).includes(t.nome)).map(blk).join("")}</div></div>`).join("")||`<div class="vuoto">Nessun tavolo in ${esc(S.sala)}.</div>`}</div></div>`;
  legaPannello();
  $$(".blk[data-bk]").forEach(el=>dragBooking(el,S.pren.find(p=>p.id===el.dataset.bk)));
}

/* ---------- ARRIVI ---------- */
function vArrivi(m){
  const ps=filtra(S.pren.filter(p=>ATT.includes(p.stato)||p.stato==="arrivato")), step=15;
  const sl=new Map(); ps.forEach(p=>{const k=Math.floor(mi(p.ora)/step)*step;if(!sl.has(k))sl.set(k,{tot:0,arr:0});const o=sl.get(k);o.tot+=+p.persone||0;if(p.stato==="arrivato")o.arr+=+p.persone||0;});
  const ks=[...sl.keys()].sort((x,y)=>x-y), max=Math.max(1,...[...sl.values()].map(o=>o.tot));

  m.innerHTML=`<div class="scroll"><div class="arr"><div class="bars">${ks.map(k=>{const o=sl.get(k);return `<div class="bar ${S.slot===k?"on":""}" data-sl="${k}"><b>${o.tot}</b><i style="height:${o.tot/max*160}px;background:linear-gradient(var(--y2) ${100-o.arr/o.tot*100}%,var(--blue) 0)"></i><span>${hm(k)}</span></div>`;}).join("")||'<div class="vuoto" style="flex:1">Nessun arrivo previsto.</div>'}</div>
   <div class="legend"><span><i style="background:var(--y2)"></i>Persone attese</span><span><i style="background:var(--blue)"></i>Già arrivate</span>${S.slot!=null?`<button class="btn light" id="tutti" style="min-height:32px">Mostra tutti gli orari</button>`:""}</div></div>${tabella(lst,"Nessuna prenotazione.")}</div>`;
  $$("[data-sl]").forEach(b=>b.onclick=()=>{S.slot=S.slot===+b.dataset.sl?null:+b.dataset.sl;draw();}); if($("#tutti"))$("#tutti").onclick=()=>{S.slot=null;draw();}; legaRighe(m);
}

/* ---------- VISTA MESE ---------- */
async function caricaMese(y,mm){ const k=`${y}-${pad(mm)}`; if(S.mc[k]) return; S.mc[k]="…";
  const a=`${k}-01`, b=`${k}-31`; try{ const s=await getDocs(query(collection(db,"prenotazioni"),where("data",">=",a),where("data","<=",b)));
    const g={}; s.docs.forEach(d=>{const p=d.data();if(!(ATT.includes(p.stato)||p.stato==="arrivato"))return;g[p.data]=g[p.data]||{n:0,p:0};g[p.data].n++;g[p.data].p+=+p.persone||0;}); S.mc[k]=g; }catch(e){S.mc[k]={};toast("Errore: "+e.code);} draw(); }
function vMese(m){ const [y,mm]=(S.mese||S.data.slice(0,7)).split("-").map(Number), k=`${y}-${pad(mm)}`; if(!S.mc[k]) caricaMese(y,mm);
  const g=typeof S.mc[k]==="object"?S.mc[k]:{}, cap=+(S.cfg.coperti?.cena)||150, first=new Date(y,mm-1,1), off=(first.getDay()+6)%7, t0=iso(new Date());
  let c=""; for(let i=0;i<42;i++){const d=new Date(y,mm-1,1-off+i),s=iso(d),o=g[s]; if(i>=35&&d.getMonth()!==mm-1) break;
    c+=`<div class="cel ${d.getMonth()!==mm-1?"fuori":""} ${s===S.data?"on":""} ${s===t0?"oggi":""}" data-md="${s}"><span class="d">${d.getDate()}</span>${o?`<div class="p"><b>${o.p}</b> pers · ${o.n} pren.</div><div class="bg"><i style="width:${Math.min(100,o.p/cap*100)}%"></i></div>`:""}</div>`;}
  const tot=Object.values(g).reduce((a,o)=>({n:a.n+o.n,p:a.p+o.p}),{n:0,p:0});
  m.innerHTML=`<div class="scroll"><div class="mese"><div class="mh"><button class="btn light" id="mP">‹</button><h2>${MM[mm-1]} ${y}</h2><button class="btn light" id="mN">›</button><span class="muted">${S.mc[k]==="…"?"Caricamento…":`${tot.n} prenotazioni · ${tot.p} persone`}</span></div>
   <div class="mg">${["Lun","Mar","Mer","Gio","Ven","Sab","Dom"].map(x=>`<div class="h">${x}</div>`).join("")}${c}</div></div></div>`;
  const sp=n=>{const d=new Date(y,mm-1+n,1);S.mese=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;draw();};
  $("#mP").onclick=()=>sp(-1);$("#mN").onclick=()=>sp(1);
  $$("[data-md]").forEach(b=>b.onclick=()=>{S.tab="lista";vaiGiorno(b.dataset.md);});
}

async function agg(p,d,msg){ try{ await updateDoc(doc(db,"prenotazioni",p.id),{...d,aggiornatoIl:serverTimestamp(),aggiornatoDa:S.me.nome||""}); if(msg) toast(msg); }catch(e){toast("Errore: "+e.code);} }

async function arrivati(p){ await agg(p,{stato:"arrivato",arrivatoIl:serverTimestamp(),liberato:false},`${p.nome}: arrivati ✓`);
  if(p.clienteId&&!p.walkin){ await setDoc(doc(db,"clienti",p.clienteId),{presenze:increment(1),ultimaPresenza:p.data},{merge:true}).catch(()=>{}); S.cli.delete(p.clienteId); evento(p.clienteId,"arrivo",`Arrivato · ${p.persone} persone`); } }
function chiudi(p){ if(!p) return;
  if(p.stato==="richiesta") return accettaChiedi(p);
  if(CH.includes(p.stato)) return scegli(`Riaprire la prenotazione di ${p.nome}?`,[["Riapri",async()=>{await agg(p,{stato:p.fila?"attesa":"confermata",liberato:false},"Riaperta");
    if(p.clienteId&&p.stato==="arrivato"&&!p.walkin) setDoc(doc(db,"clienti",p.clienteId),{presenze:increment(-1)},{merge:true}).catch(()=>{});
    if(p.clienteId&&p.stato==="noshow") setDoc(doc(db,"clienti",p.clienteId),{noShow:increment(-1)},{merge:true}).catch(()=>{});}]]);
  const ops=[["Arrivati",()=>arrivati(p)],["Non arrivati",async()=>{await agg(p,{stato:"noshow"},"Segnato come non arrivato");if(p.clienteId){setDoc(doc(db,"clienti",p.clienteId),{noShow:increment(1)},{merge:true}).catch(()=>{});evento(p.clienteId,"noshow","Non arrivato");}}]];
  if(p.stato!=="attesa") ops.push(["Sposta in FilaFast",()=>agg(p,{stato:"attesa",fila:true,attesa:+p.attesa||15},"Spostata in FilaFast")]);
  scegli(`Vuoi chiudere la prenotazione di ${p.nome} per ${p.persone}?`,ops); }
function accettaChiedi(p){ scegli(`Richiesta web: ${p.nome} · ${bello(p.data)} alle ${p.ora} · ${p.persone} persone${p.note?" · "+p.note:""}`,[["Accetta",()=>accetta(p,true)],["Rifiuta",()=>accetta(p,false)],["Apri e modifica",()=>apriScheda(p)]]); }
async function accetta(p,si){ if(!p) return; const o={nome:(p.nome||"").split(" ")[0],giorno:bello(p.data),ora:p.ora,persone:p.persone};
  if(!si){ if(!confirm(`Rifiutare la richiesta di ${p.nome}?`)) return; await agg(p,{stato:"rifiutata"},"Richiesta rifiutata"); if(p.telefono) wa(p.telefono,fill(S.cfg.msg?.rifiutata||MSG.rifiutata,o)); return; }
  await agg(p,{stato:"confermata"},"Prenotazione accettata ✓");
  const t=telNorm(p.telefono);
  if(p.clienteId&&t){ const ex=await getDoc(doc(db,"clienti",p.clienteId)).catch(()=>null);
    if(!ex||!ex.exists()){ await setDoc(doc(db,"clienti",p.clienteId),{nome:p.nomeSolo||o.nome,cognome:p.cognomeSolo||(p.nome||"").split(" ").slice(1).join(" "),telefono:"+"+t,email:p.email||null,presenze:0,puntiFidelity:0,dataRegistrazione:iso(new Date()),provenienza:"prenotazione web",origine:"penelope",
        consensi:{privacy:true,marketing:!!p.consensi?.marketing,profilazione:false,fonte:"prenotazione web",dataConsenso:iso(new Date())}},{merge:true}).catch(()=>{});
      setDoc(doc(db,"indice","nuovi"),{nuovi:arrayUnion(`${p.clienteId}|${p.nome}|+${t}`)},{merge:true}).catch(()=>{}); }
    const tg=[p.provenienza,p.fonte&&("link "+p.fonte),"prenotazione web"].filter(Boolean).map(x=>String(x).toLowerCase());
    setDoc(doc(db,"clienti",p.clienteId),{tags:arrayUnion(...tg),...(p.provenienza?{provenienzaWeb:p.provenienza}:{})},{merge:true}).catch(()=>{}); S.cli.delete(p.clienteId); }
  if(p.telefono) wa(p.telefono,fill(S.cfg.msg?.conferma||MSG.conferma,o)); }

  const up=async()=>{ window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up); if(!moved) return editTavolo(t); Object.assign(t,{x:nx,y:ny}); try{ await updateDoc(doc(db,"tavoli",t.id),{x:nx,y:ny}); }catch(e){toast("Errore: "+e.code);} };

async function rinominaSala(){ const v=S.sala, n=(prompt("Nuovo nome per "+v+":",v)||"").trim(); if(!n||n===v) return; if(S.sale.some(s=>s.toLowerCase()===n.toLowerCase())) return toast("Esiste già");
  try{ const b=writeBatch(db); S.tav.filter(t=>t.sala===v).forEach(t=>b.update(doc(db,"tavoli",t.id),{sala:n})); await b.commit();
    const cs={...(S.cfg.capSale||{})}, cc={...(S.cfg.salaColori||{})}; if(v in cs){cs[n]=cs[v];delete cs[v];} if(v in cc){cc[n]=cc[v];delete cc[v];}
    await setDoc(doc(db,"impostazioni","locale"),{sale:S.sale.map(s=>s===v?n:s),capSale:cs,salaColori:cc},{merge:true}); S.sala=n; toast("Rinominata ✓"); }catch(e){toast("Errore: "+e.code);} }
async function eliminaSala(){ const v=S.sala; if(S.tav.some(t=>t.sala===v)) return toast("Prima sposta o elimina i tavoli di questa sala"); if(!confirm("Eliminare la sala "+v+"?")) return;
  try{ await salvaSale(S.sale.filter(s=>s!==v)); toast("Eliminata ✓"); }catch(e){toast("Errore: "+e.code);} }
setInterval(()=>{ if(S.me&&oggi()&&["piantina","planning"].includes(S.tab)&&!S.edit&&!$("#sheetRoot").innerHTML&&!document.querySelector(".ghost")) draw(); },60000);
</script>
