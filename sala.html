<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="manifest" href="sala.webmanifest"><link rel="icon" href="icona-192.png"><meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1B2D">
<title>Penelope · Sala</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#14233A;--navy2:#0F1B2D;--gold:#D9C08A;--gold2:#C9A45C;--bg:#E9ECF1;--mute:#5B6474;--line:#D7DCE3;--blue:#2563EB;--free:#FFFFFF;--busy:#FFF3D6;--busyb:#E0A800;--arr:#E1ECFF;--arrb:#2563EB}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--navy);font-family:Barlow,system-ui,sans-serif;font-size:17px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select{font-family:inherit;font-size:17px;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#22385A,#0F1B2D);padding:20px}
#login form{background:#fff;border-radius:20px;padding:26px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.f{width:100%;min-height:52px;border:1.5px solid #C9CED6;border-radius:12px;padding:10px 14px;background:#fff;color:var(--navy)}
.btn{min-height:50px;border:0;border-radius:12px;padding:0 16px;font-weight:700;background:var(--navy);color:#fff}
.btn.gold{background:linear-gradient(180deg,#E6CF9C,#D2B270);color:var(--navy)}
.btn.light{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn.red{background:#fff;color:#B42318;border:2px solid #B42318}
#app{height:100vh;display:grid;grid-template-rows:auto 1fr}
header{background:linear-gradient(180deg,#16263F,#0F1B2D);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.25);z-index:3}
.brand{color:var(--gold);font-weight:700;letter-spacing:2px;font-size:12px}
.h1{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1}
.iconbtn{width:46px;height:46px;border-radius:12px;border:1px solid #33486A;background:rgba(255,255,255,.04);color:#fff;font-size:24px;font-weight:700}
.capw{order:8;flex-basis:100%;display:flex;align-items:center;gap:12px;color:#C7D0DD;font-size:14px}.capw .cb{flex:1;height:12px;background:#2A3A54;border-radius:6px;overflow:hidden}.capw .cb>div{height:12px;background:var(--gold);border-radius:6px;transition:width .3s}.capw .cb>div.over{background:#E0533D}.capw b{color:#fff;font-size:18px;font-family:'Barlow Condensed',sans-serif}
.stat{display:flex;gap:16px;color:#C7D0DD;font-size:14px}
.stat b{color:#fff;font-size:20px;display:block;font-family:'Barlow Condensed',sans-serif}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px}
.tabs button{min-height:44px;border:1px solid #2C4262;border-radius:22px;padding:0 16px;background:transparent;color:#C7D0DD;font-weight:600;white-space:nowrap}
.tabs button.on{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}
.body{display:grid;grid-template-columns:310px 1fr;min-height:0}
aside{background:#F8F9FB;border-right:1px solid var(--line);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
aside h3{margin:8px 2px 0;font-family:'Barlow Condensed',sans-serif;font-size:19px;letter-spacing:.5px;text-transform:uppercase;color:var(--mute)}
.bk{border-radius:14px;padding:10px 12px;background:#fff;touch-action:none;user-select:none;display:flex;gap:10px;align-items:center;box-shadow:0 1px 3px rgba(15,27,45,.12);border-left:5px solid var(--gold2)}
.bk.arr{border-left-color:var(--blue);background:#F4F8FF}
.bk.att{border-left-style:dashed;opacity:.85}
.av{width:40px;height:40px;border-radius:50%;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:15px}
.bk .n{font-weight:700;line-height:1.15}
.bk small{color:var(--mute);font-size:13px;display:block}
.pill{background:var(--navy);color:#fff;border-radius:10px;padding:4px 8px;font-weight:700;font-size:15px;flex-shrink:0}
.nota{display:block;margin-top:4px;background:#FFF3C4;border-left:4px solid #E0A800;border-radius:6px;padding:3px 8px;font-weight:700;color:#4A3500;font-size:13px}
.drop-list.over{outline:3px dashed var(--gold2);outline-offset:-4px;border-radius:12px}
.planwrap{position:relative;overflow:auto;padding:16px}
.plans{display:grid;gap:16px}
.plans.tutto{grid-template-columns:1fr}
.zona{background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(15,27,45,.08);overflow:hidden}
.zona h4{margin:0;padding:10px 14px;font-family:'Barlow Condensed',sans-serif;font-size:20px;display:flex;justify-content:space-between;align-items:center;background:#F3F5F8;border-bottom:1px solid var(--line)}
.zona h4 span{font-family:Barlow,system-ui,sans-serif;font-size:13px;color:var(--mute);font-weight:600}
.plan{position:relative;width:100%;aspect-ratio:16/10;background:#FBFAF7;background-image:radial-gradient(#E6E2D8 1px,transparent 1px);background-size:18px 18px}
.plans.solo .plan{min-width:720px}
.plan.big{aspect-ratio:16/12;min-width:900px}
.zg{position:absolute;border:2px dashed #D8D2C2;border-radius:14px;background:rgba(217,192,138,.06)}
.zg span{position:absolute;top:6px;left:10px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;color:#A89A78;letter-spacing:.5px;text-transform:uppercase}
.tav{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;touch-action:none;user-select:none}
.tav{min-width:46px;min-height:46px}
.tav .top{position:absolute;inset:11%;border-radius:12px;background:var(--free);border:2.5px solid #A9B3C2;box-shadow:0 3px 8px rgba(15,27,45,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;overflow:hidden;transition:transform .12s}
.tav.round .top{border-radius:50%}
.tav .ch{position:absolute;width:12%;height:12%;min-width:7px;min-height:7px;border-radius:50%;background:#C8CFDA}
.tav .tn{font-weight:700;font-size:15px;line-height:1}

.tav .tp{font-size:11px;color:var(--mute)}
.tav .who{font-size:12px;font-weight:700;line-height:1.1;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;padding:0 2px}

.tav.busy .top{background:var(--busy);border-color:var(--busyb)}
.tav.busy .ch{background:#EBC65A}
.tav.arr .top{background:var(--arr);border-color:var(--arrb)}
.tav.arr .ch{background:#8DB1F5}
.tav.over .top{transform:scale(1.12);box-shadow:0 0 0 4px var(--gold)}
.edit .tav .top{border-style:dashed;cursor:move}
.ghost{position:fixed;z-index:50;pointer-events:none;background:var(--navy);color:#fff;border-radius:14px;padding:10px 16px;font-weight:700;box-shadow:0 12px 28px rgba(0,0,0,.35);transform:translate(-50%,-70%) rotate(-2deg)}
.sheet-bg{position:fixed;inset:0;background:rgba(11,21,34,.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:#fff;border-radius:20px;max-width:460px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.sheet h2{margin:0;font-family:'Barlow Condensed',sans-serif;font-size:26px}
#embed{position:fixed;inset:0;z-index:45;background:rgba(11,21,34,.55);display:flex;justify-content:center}
#embed iframe{width:100%;max-width:720px;height:100%;border:0;background:#F3F4F6;box-shadow:0 0 40px rgba(0,0,0,.4)}
.muted{color:var(--mute);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:14px 18px;border-radius:14px;z-index:60;font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--mute);margin-top:12px;align-items:center}
.legend i{display:inline-block;width:16px;height:16px;border-radius:5px;margin-right:6px;vertical-align:-3px;border:2px solid #A9B3C2;background:#fff}

@media (max-width:800px){.body{grid-template-columns:1fr}aside{max-height:34vh;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div id="login" class="hidden">
  <form id="lf"><div class="brand" style="color:var(--gold2)">THE GALLEON</div><div class="h1" style="font-size:34px">Penelope · Sala</div>
    <label for="lem">Email</label><input class="f" id="lem" type="email" autocomplete="username" required>
    <label for="lpw">Password</label><input class="f" id="lpw" type="password" autocomplete="current-password" required>
    <button class="btn gold" type="submit">Entra</button><div id="lerr" class="muted"></div></form>
</div>
<div id="app" class="hidden">
  <header>
    <button class="iconbtn" id="prev" aria-label="Giorno prima">‹</button>
    <div><div class="brand">PENELOPE · THE GALLEON</div><div class="h1" id="titolo"></div></div>
    <button class="iconbtn" id="next" aria-label="Giorno dopo">›</button>
    <button class="btn gold" id="oggi" style="min-height:44px">Oggi</button>
    <div class="stat" id="stat"></div>
    <div class="capw" id="capw"><span>Coperti</span><div class="cb"><div id="capBar"></div></div><b id="capTxt"></b></div>
    <div class="tabs" id="tabs" style="order:9;flex-basis:100%"></div>
    <button class="btn gold" id="nuova" style="min-height:44px">+ Prenota</button>
    <button class="iconbtn" id="fs" aria-label="Schermo intero" title="Schermo intero">⛶</button>
    <button class="btn light" id="edit" style="min-height:44px">✎ Modifica sala</button>
  </header>
  <div class="body">
    <aside id="side" class="drop-list"></aside>
    <div class="planwrap"><div id="editbar" class="hidden" style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center"></div><div id="plans" class="plans"></div>
      <div class="legend"><span><i></i>Libero</span><span><i style="background:var(--busy);border-color:var(--busyb)"></i>Prenotato</span><span><i style="background:var(--arr);border-color:var(--arrb)"></i>Arrivati</span><span style="margin-left:auto">Trascina i nomi sui tavoli · tocca un nome per la scheda completa</span></div></div>
  </div>
</div>
<div id="sheetRoot"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, setDoc, deleteDoc, addDoc, collection, query, where, onSnapshot, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBzpnM1H7Nk99bGqiKoFvJfZfUEhxYt1yI",authDomain:"galleon-club.firebaseapp.com",projectId:"galleon-club",storageBucket:"galleon-club.firebasestorage.app",messagingSenderId:"256580919264",appId:"1:256580919264:web:1639030e273fae781fd585"});
const auth=getAuth(app), db=getFirestore(app);
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0"), iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const GG=["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"], MM=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const bello=s=>{const d=new Date(s+"T12:00:00");return `${GG[d.getDay()]} ${d.getDate()} ${MM[d.getMonth()]}`;};
const toast=m=>{const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);};
const iniziali=n=>String(n||"?").split(" ").filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join("");
let SALE=["Sala principale"];
const REG={"Sala principale":[0,0,62,64],"Saletta ABCD":[63,0,37,34],"Sala divani":[63,35,37,29],"Veranda":[0,65,100,35]};
const salaDi=t=>SALE.includes(t.sala)?t.sala:SALE[0];
const ordTutti=()=>S.tav.slice().sort((a,b)=>(SALE.indexOf(salaDi(a))-SALE.indexOf(salaDi(b)))||String(a.nome).localeCompare(String(b.nome),undefined,{numeric:true}));
const geo=(t,g)=>{ if(!g) return {x:t.x,y:t.y,w:t.w||8,h:t.h||11};
  const i=ordTutti().findIndex(x=>x.id===t.id), C=9, r=Math.floor(i/C), c=i%C;
  return {x:t.gx??+(2+c*(96/C)+1).toFixed(1), y:t.gy??+(3+r*(94/Math.max(5,Math.ceil(S.tav.length/C)))).toFixed(1), w:7.5, h:11}; };
const S={cfg:{},data:iso(new Date()),sala:"Sala principale",edit:false,tav:[],pren:[],me:null,u2:null};

$("#lf").onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$("#lem").value.trim(),$("#lpw").value);$("#lpw").value="";}catch(x){$("#lerr").textContent="Email o password non corretti.";}};
onAuthStateChanged(auth,async u=>{
  if(!u){$("#login").classList.remove("hidden");$("#app").classList.add("hidden");return;}
  const sd=await getDoc(doc(db,"staff",u.uid)).catch(()=>null);
  if(!sd||!sd.exists()){$("#lerr").textContent="Account non abilitato.";signOut(auth);return;}
  S.me={uid:u.uid,...sd.data()}; $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#edit").classList.toggle("hidden",S.me.ruolo!=="admin");
  onSnapshot(doc(db,"impostazioni","locale"),d=>{ S.cfg=d.exists()?d.data():{}; SALE=(S.cfg.sale&&S.cfg.sale.length)?S.cfg.sale:["Sala principale"]; if(S.sala!=="tutto"&&!SALE.includes(S.sala)) S.sala=SALE[0]; draw(); },()=>{});
  onSnapshot(collection(db,"tavoli"),s=>{S.tav=s.docs.map(d=>({id:d.id,...d.data()}));draw();},e=>toast("Errore tavoli: "+e.code));
  ascolta();
});
function ascolta(){ if(S.u2)S.u2(); S.u2=onSnapshot(query(collection(db,"prenotazioni"),where("data","==",S.data)),s=>{S.pren=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>["confermata","arrivato","attesa"].includes(p.stato)).sort((a,b)=>(a.ora||"").localeCompare(b.ora||""));draw();},e=>toast("Errore prenotazioni: "+e.code)); }
const shift=n=>{const d=new Date(S.data+"T12:00:00");d.setDate(d.getDate()+n);S.data=iso(d);ascolta();draw();};
$("#nuova").onclick=()=>apri(`classica.html?embed=1&nuova=1&data=${S.data}`);
$("#prev").onclick=()=>shift(-1); $("#next").onclick=()=>shift(1); $("#oggi").onclick=()=>{S.data=iso(new Date());ascolta();draw();};
$("#edit").onclick=()=>{S.edit=!S.edit; $("#edit").textContent=S.edit?"✓ Fine modifica":"✎ Modifica sala";draw();};
const fsOn=()=>{ const d=document.documentElement; if(!document.fullscreenElement&&d.requestFullscreen) d.requestFullscreen({navigationUI:"hide"}).catch(()=>{}); };
$("#fs").onclick=()=>document.fullscreenElement?document.exitFullscreen():fsOn();
document.addEventListener("pointerdown",()=>{ try{ if(localStorage.getItem("pen_fs")!=="no") fsOn(); }catch(e){fsOn();} },{once:true});
document.addEventListener("fullscreenchange",()=>{ $("#fs").textContent=document.fullscreenElement?"✕":"⛶"; });
window.addEventListener("message",e=>{ if(e.data&&e.data.penelope==="chiudi") $("#embed")?.remove(); });

const tavDi=p=>p.tavoli&&p.tavoli.length?p.tavoli:(p.tavolo?String(p.tavolo).split(" + "):[]);
const ordNome=(a,b)=>String(a.nome).localeCompare(String(b.nome),undefined,{numeric:true});
function sedie(t){ const n=Math.min(+t.posti||0,12); if(!n) return ""; let h="";
  for(let i=0;i<n;i++){ let x,y; if(t.forma==="tondo"){ const a=2*Math.PI*i/n-Math.PI/2; x=50+46*Math.cos(a); y=50+46*Math.sin(a); }
    else { const lato=i%4, k=Math.floor(i/4), tot=Math.ceil((n-lato)/4), pos=(k+1)/(tot+1)*100; [x,y]=[[pos,3],[97,pos],[pos,97],[3,pos]][lato]; }
    h+=`<span class="ch" style="left:calc(${x}% - 6%);top:calc(${y}% - 6%)"></span>`; } return h; }
function tavoloHTML(t,g){ const G=geo(t,g); const ps=S.pren.filter(p=>tavDi(p).includes(t.nome)); const st=ps.some(p=>p.stato==="arrivato")?"arr":ps.length?"busy":"";
  return `<div class="tav ${t.forma==="tondo"?"round":""} ${st}" data-t="${t.id}" style="left:${G.x}%;top:${G.y}%;width:${G.w}%;height:${G.h}%">${sedie(t)}<div class="top"><div class="tn">${esc(t.nome)}</div>${ps.length?ps.map(p=>`<div class="who" data-bk="${p.id}">${p.note?"📝":""}${esc((p.nome||"").split(" ")[0])} · ${esc(p.ora||"")}</div>`).join(""):`<div class="tp">${esc(t.posti||"")} posti</div>`}</div></div>`; }

function draw(){
  $("#titolo").textContent=bello(S.data);
  const att=S.pren.filter(p=>p.stato!=="attesa"), pax=att.reduce((a,p)=>a+(+p.persone||0),0), posti=S.tav.reduce((a,t)=>a+(+t.posti||0),0);
  const cap=+(S.cfg.coperti?.cena)||posti||80; $("#capTxt").textContent=`${pax} / ${cap}`; $("#capBar").style.width=Math.min(100,100*pax/cap)+"%"; $("#capBar").classList.toggle("over",pax>cap);
  $("#stat").innerHTML=`<div><b>${att.length}</b>prenotazioni</div><div><b>${pax}${posti?"/"+posti:""}</b>coperti</div><div><b>${att.filter(p=>p.stato==="arrivato").length}</b>arrivati</div>`;
  if(SALE.length<2&&S.sala==="tutto") S.sala=SALE[0];
  const tabs=SALE.length>1?[["tutto","Tutto il locale"],...SALE.map(s=>[s,s])]:[];
  $("#tabs").innerHTML=tabs.map(([k,t])=>`<button class="${k===S.sala?"on":""}" data-s="${esc(k)}">${esc(t)}</button>`).join("");
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ S.sala=b.dataset.s;draw();});
  // lista
  const libere=S.pren.filter(p=>!tavDi(p).length), sedute=S.pren.filter(p=>tavDi(p).length);
  const card=p=>`<div class="bk ${p.stato==="arrivato"?"arr":""} ${p.stato==="attesa"?"att":""}" data-bk="${p.id}"><div class="av">${esc(iniziali(p.nome))}</div><div style="flex:1;min-width:0"><span class="n">${esc(p.nome||"—")}</span><small>👥 ${esc(p.persone)}${tavDi(p).length?" · 🍽 "+esc(tavDi(p).join(" + ")):""}${p.stato==="attesa"?" · in attesa":""}${p.stato==="arrivato"?" · arrivati ✓":""}</small>${p.note?`<span class="nota">📝 ${esc(p.note)}</span>`:""}</div><span class="pill">${esc(p.ora||"")}</span></div>`;
  $("#side").innerHTML=`<h3>Da sistemare · ${libere.length}</h3>${libere.map(card).join("")||'<div class="muted">Tutti hanno un tavolo 👍</div>'}<h3>Al tavolo · ${sedute.length}</h3>${sedute.map(card).join("")}<div class="muted" style="margin-top:6px">Trascina qui un nome per togliergli il tavolo.</div>`;
  document.querySelectorAll("#side [data-bk]").forEach(el=>dragBooking(el,S.pren.find(p=>p.id===el.dataset.bk)));
  // piantine
  const TUTTO=S.sala==="tutto"; const UNA=SALE.length<2;
  $("#plans").className="plans "+(TUTTO?"tutto":"solo")+(S.edit?" edit":"");
  if(TUTTO){ const occ=S.tav.filter(t=>S.pren.some(p=>tavDi(p).includes(t.nome))).length;
    $("#plans").innerHTML=`<div class="zona"><h4>Tutto il locale<span>${occ} occupati · ${S.tav.length-occ} liberi</span></h4><div class="plan big">${S.tav.map(t=>tavoloHTML(t,true)).join("")}</div></div>`
      +(S.tav.length?"":`<div class="muted" style="margin-top:10px">Nessun tavolo: apri una sala per crearli.</div>`);
  } else $("#plans").innerHTML=[S.sala].map(z=>{ const tv=S.tav.filter(t=>salaDi(t)===z).sort(ordNome); const occ=tv.filter(t=>S.pren.some(p=>tavDi(p).includes(t.nome))).length;
    return `<div class="zona"><h4>${esc(z)}<span>${tv.length?`${occ} occupati · ${tv.length-occ} liberi`:"nessun tavolo"}</span></h4><div class="plan${UNA?" big":""}">${tv.map(t=>tavoloHTML(t,UNA)).join("")||`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--mute)">Nessun tavolo qui.${S.me?.ruolo==="admin"?`<button class="btn gold" data-seed="${esc(z)}">Crea i tavoli</button>`:""}</div>`}</div></div>`; }).join("");
  document.querySelectorAll("[data-seed]").forEach(b=>b.onclick=()=>seed(b.dataset.seed));
  document.querySelectorAll(".tav").forEach(el=>{ const t=S.tav.find(x=>x.id===el.dataset.t); if(S.edit) dragTable(el,t,TUTTO||UNA); else el.onclick=e=>{ if(!e.target.closest("[data-bk]")) menuTavolo(t); }; });
  document.querySelectorAll(".tav [data-bk]").forEach(el=>{ if(!S.edit) dragBooking(el,S.pren.find(p=>p.id===el.dataset.bk)); });
  $("#editbar").classList.toggle("hidden",!S.edit);
  if(S.edit){ $("#editbar").innerHTML=`<button class="btn gold" id="addT">+ Aggiungi tavolo</button><button class="btn light" id="addS">+ Nuova sala</button>${S.sala!=="tutto"?`<button class="btn light" id="renS">Rinomina sala</button>${SALE.length>1?`<button class="btn light" id="delS">Elimina sala</button>`:""}`:""}<span class="muted">Trascina i tavoli per spostarli. Toccali per cambiare nome, posti, sala, forma e dimensione.</span>`; $("#addT").onclick=()=>editTavolo(null); $("#addS").onclick=nuovaSala; if($("#renS")) $("#renS").onclick=rinominaSala; if($("#delS")) $("#delS").onclick=eliminaSala; }
}

/* ---- trascinamento prenotazioni ---- */
function dragBooking(el,p){ if(!p) return;
  el.onpointerdown=e=>{ if(S.edit) return; e.preventDefault(); e.stopPropagation(); const sx=e.clientX,sy=e.clientY; let g=null,over=null,moved=false;
    const trova=(x,y)=>{const t=document.elementFromPoint(x,y);return t?.closest(".tav")||t?.closest(".drop-list");};
    const mv=ev=>{ if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<8) return; moved=true;
      if(!g){g=document.createElement("div");g.className="ghost";g.textContent=`${p.nome||""} · ${p.persone}`;document.body.appendChild(g);}
      g.style.left=ev.clientX+"px";g.style.top=ev.clientY+"px"; const z=trova(ev.clientX,ev.clientY); if(z!==over){over?.classList.remove("over");over=z;over?.classList.add("over");} };
    const up=ev=>{ window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up); g?.remove(); over?.classList.remove("over");
      if(!moved){ apriScheda(p); return; }
      const z=trova(ev.clientX,ev.clientY);
      if(z?.classList.contains("tav")){ const tav=S.tav.find(x=>x.id===z.dataset.t), cur=tavDi(p); if(cur.includes(tav.nome)) return;
        if(cur.length) scegli(`${p.nome}: spostare o unire?`,[[`Sposta al tavolo ${tav.nome}`,()=>setTav(p,[tav.nome],tav.sala)],[`Unisci (${cur.join(" + ")} + ${tav.nome})`,()=>setTav(p,[...cur,tav.nome],tav.sala)]]);
        else setTav(p,[tav.nome],tav.sala);
        const occ=S.pren.filter(x=>x.id!==p.id&&tavDi(x).includes(tav.nome)); if(occ.length) toast(`Attenzione: al ${tav.nome} c'è già ${occ.map(x=>x.nome).join(", ")}`);
        else if((+tav.posti||0)&&+p.persone>+tav.posti&&!cur.length) toast(`${p.persone} persone, il tavolo ${tav.nome} ha ${tav.posti} posti`);
      } else if(z && tavDi(p).length) setTav(p,[],null); };
    window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up); };
}
async function setTav(p,arr,sala){ try{ await updateDoc(doc(db,"prenotazioni",p.id),{tavoli:arr,tavolo:arr.join(" + "),sala:sala??p.sala??"",aggiornatoIl:serverTimestamp(),aggiornatoDa:S.me.nome||""}); }catch(e){toast("Errore: "+e.code);} }

/* ---- scheda completa (la stessa dell'app del telefono) ---- */
function apriScheda(p){ apri(`classica.html?embed=1&pren=${encodeURIComponent(p.id)}`); }
function apri(url){ $("#embed")?.remove(); const w=document.createElement("div"); w.id="embed";
  w.innerHTML=`<iframe src="${url}" title="Penelope"></iframe>`; w.onclick=e=>{ if(e.target===w) w.remove(); }; document.body.appendChild(w); }

/* ---- menu ---- */
function sheet(t,h){ $("#sheetRoot").innerHTML=`<div class="sheet-bg" id="sb"><div class="sheet" role="dialog"><h2>${esc(t)}</h2>${h}<button class="btn light" id="sx">Chiudi</button></div></div>`; $("#sx").onclick=close; $("#sb").onclick=e=>{if(e.target.id==="sb")close();}; }
const close=()=>$("#sheetRoot").innerHTML="";
function scegli(t,ops){ sheet(t,ops.map((o,i)=>`<button class="btn ${i?"light":""}" data-o="${i}">${esc(o[0])}</button>`).join("")); document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{close();ops[+b.dataset.o][1]();}); }
function menuTavolo(t){ const ps=S.pren.filter(p=>tavDi(p).includes(t.nome));
  sheet(`Tavolo ${t.nome} · ${t.posti||"?"} posti`, ps.length? ps.map(p=>`<button class="btn light" data-mp="${p.id}">${esc(p.ora||"")} · ${esc(p.nome)} · ${esc(p.persone)} pers.</button>`).join("")+`<button class="btn red" id="mLib">Libera il tavolo</button>` : `<div class="muted">Tavolo libero. Trascina qui un nome dalla lista a sinistra.</div>`);
  document.querySelectorAll("[data-mp]").forEach(b=>b.onclick=()=>{close();apriScheda(S.pren.find(p=>p.id===b.dataset.mp));});
  if($("#mLib")) $("#mLib").onclick=()=>{ ps.forEach(p=>setTav(p,tavDi(p).filter(n=>n!==t.nome),p.sala)); close(); }; }

/* ---- modifica tavoli ---- */
function dragTable(el,t,g){ el.onpointerdown=e=>{ e.preventDefault(); const plan=el.parentElement.getBoundingClientRect(); const G=geo(t,g); const sx=e.clientX,sy=e.clientY,ox=G.x,oy=G.y; let moved=false, nx=ox, ny=oy;
  const mv=ev=>{ if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<6) return; moved=true;
    nx=Math.max(0,Math.min(100-G.w,Math.round((ox+(ev.clientX-sx)/plan.width*100)*2)/2)); ny=Math.max(0,Math.min(100-G.h,Math.round((oy+(ev.clientY-sy)/plan.height*100)*2)/2)); el.style.left=nx+"%"; el.style.top=ny+"%"; };
  const up=async()=>{ window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up); if(!moved){ editTavolo(t); return; } const d=g?{gx:nx,gy:ny}:{x:nx,y:ny}; Object.assign(t,d); try{ await updateDoc(doc(db,"tavoli",t.id),d); }catch(e){toast("Errore: "+e.code);} };
  window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up); }; }
function editTavolo(t){ const n=!t; t=t||{nome:"",posti:4,sala:S.sala==="tutto"?SALE[0]:S.sala,forma:"quadrato",w:8,h:11,x:2,y:2};
  sheet(n?"Nuovo tavolo":"Modifica tavolo "+t.nome,`
    <label>Nome<input class="f" id="eN" value="${esc(t.nome)}" placeholder="es. 19, A, Pedana 4"></label>
    <div class="grid2"><label>Posti<input class="f" id="eP" type="number" min="1" value="${esc(t.posti)}"></label>
    <label>Forma<select class="f" id="eF"><option value="quadrato" ${t.forma!=="tondo"?"selected":""}>Quadrato</option><option value="tondo" ${t.forma==="tondo"?"selected":""}>Tondo</option></select></label></div>
    <label>Sala<select class="f" id="eS">${SALE.map(s=>`<option ${s===salaDi(t)?"selected":""}>${esc(s)}</option>`).join("")}</select></label>
    <div class="grid2"><label>Larghezza<select class="f" id="eW">${[[6,"Piccolo"],[8,"Normale"],[10,"Grande"],[13,"Lungo"],[16,"Molto lungo"],[20,"Tavolata"]].map(([v,l])=>`<option value="${v}" ${v==(t.w||8)?"selected":""}>${l}</option>`).join("")}</select></label>
    <label>Altezza<select class="f" id="eH">${[[8,"Bassa"],[11,"Normale"],[14,"Alta"],[18,"Molto alta"],[24,"Tavolata"]].map(([v,l])=>`<option value="${v}" ${v==(t.h||11)?"selected":""}>${l}</option>`).join("")}</select></label></div>
    <button class="btn gold" id="eOk">${n?"Aggiungi":"Salva"}</button>${n?"":`<button class="btn red" id="eDel">Elimina tavolo</button>`}`);
  $("#eOk").onclick=async()=>{ const d={nome:$("#eN").value.trim(),posti:+$("#eP").value||0,forma:$("#eF").value,sala:$("#eS").value,w:+$("#eW").value,h:+$("#eH").value};
    if(!d.nome) return toast("Scrivi il nome"); if(S.tav.some(x=>x.nome.toLowerCase()===d.nome.toLowerCase()&&x.id!==t.id)) return toast("Esiste già un tavolo con questo nome");
    try{ if(n) await addDoc(collection(db,"tavoli"),{...d,x:t.x,y:t.y}); else await updateDoc(doc(db,"tavoli",t.id),d); if(d.sala!==S.sala) S.sala=d.sala; close(); toast("Salvato ✓"); }catch(e){toast("Errore: "+e.code);} };
  if($("#eDel")) $("#eDel").onclick=async()=>{ if(confirm(`Eliminare il tavolo ${t.nome}?`)){ await deleteDoc(doc(db,"tavoli",t.id)).catch(e=>toast(e.code)); close(); } }; }

const salvaSale=async l=>{ await setDoc(doc(db,"impostazioni","locale"),{sale:l},{merge:true}); };
async function nuovaSala(){ const n=(prompt("Nome della nuova sala (es. Veranda, Giardino):")||"").trim(); if(!n) return;
  if(SALE.some(s=>s.toLowerCase()===n.toLowerCase())) return toast("Esiste già");
  try{ await salvaSale([...SALE,n]); S.sala=n; toast("Sala creata ✓ Ora aggiungi i tavoli"); }catch(e){toast("Errore: "+e.code);} }
async function rinominaSala(){ const v=S.sala, n=(prompt("Nuovo nome per "+v+":",v)||"").trim(); if(!n||n===v) return;
  if(SALE.some(s=>s.toLowerCase()===n.toLowerCase())) return toast("Esiste già");
  try{ const b=writeBatch(db); S.tav.filter(t=>salaDi(t)===v).forEach(t=>b.update(doc(db,"tavoli",t.id),{sala:n})); await b.commit(); await salvaSale(SALE.map(s=>s===v?n:s)); S.sala=n; toast("Rinominata ✓"); }catch(e){toast("Errore: "+e.code);} }
async function eliminaSala(){ const v=S.sala; if(S.tav.some(t=>t.sala===v)) return toast("Prima sposta o elimina i tavoli di questa sala");
  if(!confirm("Eliminare la sala "+v+"?")) return; try{ await salvaSale(SALE.filter(s=>s!==v)); S.sala=SALE[0]; toast("Eliminata ✓"); }catch(e){toast("Errore: "+e.code);} }
const GRUPPI={"Sala principale":[...Array.from({length:18},(_,i)=>String(i+1)),"Pedana 1","Pedana 2","Pedana 3"],};
async function seed(sala){
  const nomi=(GRUPPI[sala]||[]).filter(n=>!S.tav.some(t=>t.nome.toLowerCase()===n.toLowerCase()));
  if(!nomi.length){ editTavolo({nome:"",posti:4,sala,forma:"quadrato",w:8,h:11,x:4,y:6}); return; }
  if(!confirm(`Creo in ${sala} i tavoli: ${nomi.join(", ")}? Poi li sposti e sistemi i posti con ✎ Modifica sala.`)) return;
  const b=writeBatch(db), cols=nomi.length>12?7:nomi.length>4?6:4; // tavoli più grandi e leggibili
  const rows=Math.ceil(nomi.length/cols), passo=Math.min(30,88/rows);
  nomi.forEach((nome,i)=>{ const r=Math.floor(i/cols),c=i%cols; b.set(doc(collection(db,"tavoli")),{nome,sala,posti:4,forma:"quadrato",w:11,h:16,x:2+c*(96/cols),y:4+r*passo}); });
  try{ await b.commit(); toast("Tavoli creati ✓"); }catch(e){toast("Errore: "+e.code);}
}
</script>
