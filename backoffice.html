/* --- IMPORTA FIDELITY (CSV esportati da Pienissimo) --- */
function leggiCSV(t){const out=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++;}else q=false;}else c+=ch;}else if(ch==='"')q=true;else if(ch===","){r.push(c);c="";}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);out.push(r);r=[];c="";}else c+=ch;}if(c||r.length){r.push(c);out.push(r);}return out;}

PAGINE.trend=async()=>{
 const st=await storico(),anni=[...new Set(Object.keys(st?.mesi||{}).map(k=>k.slice(0,4)))].sort().reverse();let y=String(new Date().getFullYear());if(!anni.includes(y))anni.unshift(y);

  $("#tY").onchange=e=>{y=e.target.value;draw();};
  const m=await datiMesi(+y-1,+y),sum=(yy,f)=>Object.entries(m).filter(([k])=>k.startsWith(yy)).reduce((a,[,v])=>a+v[f],0);
  const pax=sum(y,"p"),pr=sum(y,"n"),paxP=sum(String(+y-1),"p"),prP=sum(String(+y-1),"n"),vs=(a,b)=>b?`<i class="${a>=b?"up":"dn"}">${a>=b?"▲":"▼"} ${Math.abs(Math.round((a-b)/b*100))}% vs ${+y-1}</i>`:"";
  const [tot,mkt]=await Promise.all([cnt(C()),cnt(query(C(),where("consensi.marketing","==",true)))]);
  $("#tK").innerHTML=`<div class="card kpi"><small>Persone ${y}</small><b>${fmt(pax)}</b>${vs(pax,paxP)}</div><div class="card kpi"><small>Prenotazioni ${y}</small><b>${fmt(pr)}</b>${vs(pr,prP)}</div><div class="card kpi"><small>Persone per prenotazione</small><b>${pr?(pax/pr).toFixed(1):"—"}</b></div><div class="card kpi"><small>Clienti con consenso marketing</small><b>${tot?Math.round(100*(mkt||0)/tot)+"%":"—"}</b><i>${fmt(mkt)} su ${fmt(tot)}</i></div>`;
  graficoAnno("#t1",+y);
  const hb=(sel,tit,m)=>{const e=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=Math.max(1,...e.map(x=>x[1]));$(sel).innerHTML=`<h3>${tit}</h3>`+(e.length?e.map(([k,v])=>`<div class="hbar"><span title="${esc(k)}">${esc(k)}</span><div><i style="width:${100*v/mx}%"></i></div><b>${fmt(v)}</b></div>`).join(""):`<div class="muted">Nessun dato</div>`);};
  const agg=a=>{const o={};(st?.[a]||[]).filter(x=>x[0]===y).forEach(x=>{o[x[1]]=(o[x[1]]||0)+x[2];});return o;};
  const GS=["Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato","Domenica"],wd={};Object.entries(agg("settimana")).forEach(([k,v])=>wd[GS[+k]]=v);
  hb("#t2","Persone per giorno della settimana",wd);hb("#t3","Persone per causale",agg("causali"));hb("#t4","Da dove prenotano",agg("canali"));};

     setDoc(doc(db,"indice","nuovi"),{nuovi:arrayUnion(`${id}|${c.n||""} ${c.c||""}|+${t}`)},{merge:true}).catch(()=>{});}else agg++;
