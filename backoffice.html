function leggiCSV(t){const out=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++;}else q=false;}else c+=ch;}else if(ch==='"')q=true;else if(ch===","){r.push(c);c="";}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);out.push(r);r=[];c="";}else c+=ch;}if(c||r.length){r.push(c);out.push(r);}return out;}

 $("#main").innerHTML=`<div class="hd"><button class="btn g" id="mP">‹</button><h1 style="color:#E5484D">${MM[m-1]} ${y}</h1><button class="btn g" id="mN">›</button><button class="btn g" id="mO">Oggi</button><span class="sp"></span><label class="muted">Sale <select class="pill" id="mS"><option value="">Tutte le sale</option>${(S.cfg.sale||[]).map(s=>`<option>${esc(s)}</option>`).join("")}</select></label></div><div class="card grid g4" id="mK"></div><div id="mC"></div>`;
 $("#mP").onclick=()=>{const d=new Date(y,m-2,1);ME=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;PAGINE.mese();};$("#mN").onclick=()=>{const d=new Date(y,m,1);ME=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;PAGINE.mese();};$("#mO").onclick=()=>{ME=iso(new Date()).slice(0,7);PAGINE.mese();};
 const s=await getDocs(query(P(),where("data",">=",iso(pri)),where("data","<=",iso(ult))));const all=s.docs.map(x=>x.data());
 const draw=()=>{const sala=$("#mS").value,l=all.filter(p=>!sala||p.sala===sala),ok=l.filter(p=>["confermata","arrivato"].includes(p.stato));
  $("#mK").innerHTML=[["Prenotazioni",ok.length],["Filafast",l.filter(p=>p.fila).length],["Pax confermati",ok.reduce((t,p)=>t+(+p.persone||0),0)],["Pax lista d'attesa",l.filter(p=>p.stato==="attesa").reduce((t,p)=>t+(+p.persone||0),0)]].map(([t,v])=>`<div class="kpi"><small>${t}</small><b style="font-size:24px">${v}</b></div>`).join("");
  const gd={};ok.forEach(p=>{gd[p.data]=gd[p.data]||{n:0,p:0};gd[p.data].n++;gd[p.data].p+=+p.persone||0;});
  let h=["lun","mar","mer","gio","ven","sab","dom"].map(g=>`<div class="gh">${g}</div>`).join("");const off=(pri.getDay()+6)%7;for(let i=0;i<off;i++)h+=`<div class="fuori"></div>`;
  for(let g=1;g<=ult.getDate();g++){const k=`${y}-${pad(m)}-${pad(g)}`,v=gd[k];h+=`<div class="${k===iso(new Date())?"oggi":""}" data-g="${k}" style="cursor:pointer"><span class="n">${g}</span>${v?`<span class="bd"><b>${v.n}</b><i>${v.p}</i></span>`:""}</div>`;}
  $("#mC").innerHTML=`<div class="cal">${h}</div><div class="muted" style="margin-top:6px"><span class="bd" style="margin:0"><b>n</b></span> prenotazioni · <span class="bd" style="margin:0"><i>n</i></span> persone. Tocca un giorno per aprirlo.</div>`;
  $$("[data-g]").forEach(c=>c.onclick=()=>{PR.data=c.dataset.g;SEZ="pren";PAG="prenotazioni";vai();});};
 $("#mS").onchange=draw;draw();
};


/* --- MENU DIGITALE --- */
const S3MENU="https://pienissimo.s3.eu-central-1.amazonaws.com/menu/ecf6b172f2fcad2fa98f097bc4389d56/8-menudati.json";
const lng=(a,l)=>Array.isArray(a)?((a.find(x=>x.lingua===l)||{}).nome||""):(typeof a==="string"?a:"");
const pulisci=t=>String(t||"").normalize("NFKC").replace(/\s+\n/g,"\n").trim();
let MENUDOC=null;
async function caricaMenu(){if(MENUDOC)return MENUDOC;const d=await getDoc(doc(db,"menu","principale")).catch(()=>null);MENUDOC=d&&d.exists()?d.data():{categorie:[]};return MENUDOC;}
async function salvaMenu(){MENUDOC.aggiornatoIl=iso(new Date());await setDoc(doc(db,"menu","principale"),MENUDOC);toast("Menu salvato");}
PAGINE.menuEl=async()=>{
 const m=await caricaMenu();
 const draw=()=>{$("#main").innerHTML=hd("Elenco Menu","Menu")+`<div class="filters"><span class="muted">${m.categorie.length} categorie · ${m.categorie.reduce((a,c)=>a+c.prodotti.length,0)} prodotti${m.aggiornatoIl?" · aggiornato "+itD(m.aggiornatoIl):""}</span><span style="flex:1"></span><a class="btn az" href="menu.html" target="_blank" style="text-decoration:none">Vedi il menu pubblico</a><button class="btn" id="mNC">+ Categoria</button></div>`+
  (m.categorie.length?m.categorie.map((c,ci)=>`<div class="card"><div style="display:flex;align-items:center;gap:10px"><b style="flex:1;font-size:15px">${esc(c.nome.it)}</b><label class="muted"><input type="checkbox" data-ca="${ci}" ${c.attivo!==false?"checked":""}> visibile</label><button class="btn g" data-cu="${ci}" ${ci?"":"disabled"}>↑</button><button class="btn g" data-ce="${ci}">✎</button><button class="btn" data-np="${ci}">+ Prodotto</button></div>
   <table style="margin-top:8px"><tbody>${c.prodotti.map((p,pi)=>`<tr class="click" data-p="${ci}.${pi}" style="${p.attivo===false?"opacity:.45":""}"><td style="width:56px">${p.img?`<img src="${esc(p.img)}" style="width:48px;height:48px;object-fit:cover;border-radius:6px" loading="lazy">`:""}</td><td><b>${esc(p.nome.it)}</b><div class="muted" style="white-space:pre-line">${esc(p.desc.it).slice(0,140)}</div></td><td style="width:90px;text-align:right"><b>${p.prezzo!=null?Number(p.prezzo).toFixed(2)+" €":""}</b></td><td style="width:90px">${p.attivo===false?'<span class="chip" style="background:#999">nascosto</span>':""}</td></tr>`).join("")}</tbody></table></div>`).join("")
  :`<div class="card">Il menu è vuoto. Usa <b>Menu → Importa da Pienissimo</b> per copiarlo.</div>`);
  $$("[data-ca]").forEach(x=>x.onchange=()=>{m.categorie[+x.dataset.ca].attivo=x.checked;salvaMenu();});
  $$("[data-cu]").forEach(x=>x.onclick=()=>{const i=+x.dataset.cu;[m.categorie[i-1],m.categorie[i]]=[m.categorie[i],m.categorie[i-1]];salvaMenu().then(draw);});
  $$("[data-ce]").forEach(x=>x.onclick=()=>{const c=m.categorie[+x.dataset.ce];modal("Categoria",`<label class="l">Nome (italiano)</label><input class="f" id="cI" value="${esc(c.nome.it)}"><label class="l">Nome (inglese)</label><input class="f" id="cE" value="${esc(c.nome.en)}"><button class="btn r" id="cDel" style="margin-top:12px">Elimina categoria</button>`,async ov=>{c.nome={it:ov.querySelector("#cI").value,en:ov.querySelector("#cE").value};await salvaMenu();draw();});
   $("#cDel").onclick=async()=>{if(!confirm("Eliminare la categoria e i suoi prodotti?"))return;m.categorie.splice(+x.dataset.ce,1);$$(".ov").forEach(o=>o.remove());await salvaMenu();draw();};});
  $("#mNC").onclick=()=>{const n=prompt("Nome della nuova categoria");if(n){m.categorie.unshift({id:"c"+Date.now(),nome:{it:n,en:n},attivo:true,prodotti:[]});salvaMenu().then(draw);}};
  $$("[data-np]").forEach(x=>x.onclick=()=>edProd(+x.dataset.np,null));
  $$("[data-p]").forEach(r=>r.onclick=()=>{const [ci,pi]=r.dataset.p.split(".").map(Number);edProd(ci,pi);});};
 const AL=["glutine","latticini","uova","pesce","crostacei","frutta_guscio","arachidi","soia","sedano","senape","sesamo","solfiti","lupini","molluschi"];
 const edProd=(ci,pi)=>{const c=m.categorie[ci],p=pi===null?{id:"p"+Date.now(),nome:{it:"",en:""},desc:{it:"",en:""},prezzo:null,attivo:true,img:"",allergeni:[]}:c.prodotti[pi];
  const ov=modal(pi===null?"Nuovo prodotto":"Modifica prodotto",`<div class="grid g2"><div><label class="l">Nome (italiano)</label><input class="f" id="pI" value="${esc(p.nome.it)}"></div><div><label class="l">Nome (inglese)</label><input class="f" id="pE" value="${esc(p.nome.en)}"></div></div>
   <label class="l">Descrizione / ingredienti (italiano)</label><textarea class="f" id="dI" style="min-height:80px">${esc(p.desc.it)}</textarea><label class="l">Descrizione (inglese)</label><textarea class="f" id="dE" style="min-height:60px">${esc(p.desc.en)}</textarea>
   <div class="grid g2"><div><label class="l">Prezzo €</label><input class="f" id="pP" type="number" step="0.5" value="${p.prezzo??""}"></div><div><label class="l">Foto (indirizzo immagine)</label><input class="f" id="pF" value="${esc(p.img||"")}"></div></div>
   <label class="l">Allergeni</label><div style="display:flex;flex-wrap:wrap;gap:10px">${AL.map(a=>`<label><input type="checkbox" data-al="${a}" ${p.allergeni?.includes(a)?"checked":""}> ${a.replace("_"," ")}</label>`).join("")}</div>
   <div style="display:flex;gap:16px;margin-top:10px"><label><input type="checkbox" id="pA" ${p.attivo!==false?"checked":""}> Visibile nel menu</label><label><input type="checkbox" id="pV" ${p.vegetariano?"checked":""}> Vegetariano</label><label><input type="checkbox" id="pG" ${p.senzaGlutine?"checked":""}> Senza glutine</label><label><input type="checkbox" id="pN" ${p.novita?"checked":""}> Novità</label></div>
   ${pi!==null?`<button class="btn r" id="pDel" style="margin-top:12px">Elimina prodotto</button>`:""}`,
   async ov=>{const g=s=>ov.querySelector(s);Object.assign(p,{nome:{it:g("#pI").value.trim(),en:g("#pE").value.trim()||g("#pI").value.trim()},desc:{it:g("#dI").value.trim(),en:g("#dE").value.trim()},prezzo:g("#pP").value===""?null:+g("#pP").value,img:g("#pF").value.trim(),
    allergeni:[...ov.querySelectorAll("[data-al]")].filter(x=>x.checked).map(x=>x.dataset.al),attivo:g("#pA").checked,vegetariano:g("#pV").checked,senzaGlutine:g("#pG").checked,novita:g("#pN").checked});
    if(!p.nome.it){toast("Inserisci il nome");return false;}if(pi===null)c.prodotti.push(p);await salvaMenu();draw();});
  if(pi!==null)ov.querySelector("#pDel").onclick=async()=>{if(!confirm("Eliminare il prodotto?"))return;c.prodotti.splice(pi,1);ov.remove();await salvaMenu();draw();};};
 draw();
};
PAGINE.menuImp=async()=>{
 $("#main").innerHTML=hd("Importa da Pienissimo","Menu")+`<div class="card"><p>Copia in Penelope il menu digitale pubblico di Pienissimo (quello del link "senza registrazione"): categorie in ordine, prodotti, prezzi, ingredienti in italiano e inglese, allergeni, foto e prodotti nascosti.</p><p class="muted">Il menu attuale di Penelope verrà sostituito.</p><button class="btn v" id="mGo">Importa il menu</button><div id="mR" class="muted" style="margin-top:10px"></div></div>`;
 $("#mGo").onclick=async()=>{if(!isAdmin())return toast("Solo l'amministratore");$("#mGo").disabled=true;$("#mR").textContent="Scarico il menu…";
  try{const j=await (await fetch(S3MENU)).json();
   const cat=j.map(x=>x.categorie).filter(Boolean).map(c=>({id:"c"+c.id_categoria,nome:{it:pulisci(lng(c.categoria?.nome,"it")),en:pulisci(lng(c.categoria?.nome,"en"))},attivo:c.categoria?.attivo!==false,
    prodotti:(c.righe||[]).map(r=>r.prodotto).filter(Boolean).map(p=>({id:"p"+p.id_prodotto,nome:{it:pulisci(lng(p.titolo,"it")||p.nome),en:pulisci(lng(p.titolo,"en")||p.nome)},desc:{it:pulisci(lng(p.desc,"it")),en:pulisci(lng(p.desc,"en"))},
     prezzo:p.prezzo??null,attivo:p.attivo!==false,img:(p.immagini||[])[0]?.urlS3||"",allergeni:p.allergeni||[],vegetariano:!!(p.vegetarian||p.vegan),senzaGlutine:!!p.gluten,novita:!!p.new}))}));
   MENUDOC={categorie:cat,fonte:"Pienissimo",importatoIl:iso(new Date())};await salvaMenu();
   $("#mR").textContent=`Fatto: ${cat.length} categorie e ${cat.reduce((a,c)=>a+c.prodotti.length,0)} prodotti importati.`;}catch(e){$("#mR").textContent="Errore: "+(e.code||e.message);$("#mGo").disabled=false;}};
};

 $("#lSv").onclick=()=>{const sp=v=>v.split(",").map(x=>x.trim()).filter(x=>/^\d{1,2}:\d{2}$/.test(x)).map(x=>x.padStart(5,"0"));const fo=sp($("#lF").value);salvaCfg({nomeLocale:$("#lN").value.trim(),mq:+$("#lM").value,sedie:+$("#lS").value,orari:{...(c.orari||{}),cena:sp($("#lO").value)},formOrari:fo,durataStd:+$("#lD").value||90}).then(()=>setDoc(doc(db,"menu","prenota"),{orari:fo.length?fo:CFG_DEF.orari.cena})).catch(e=>toast("Errore: "+(e.code||e.message)));};

 const draw=()=>{$("#main").innerHTML=hd("Causali","Impostazioni",true)+`<div class="card" style="padding:0"><table><thead><tr><th>Nome</th><th></th></tr></thead><tbody>${(S.cfg.causali||[]).map((c,i)=>`<tr><td>${esc(c)}</td><td style="text-align:right"><button class="btn g" data-e="${i}">✎</button> <button class="btn r" data-d="${i}">✕</button></td></tr>`).join("")||`<tr><td class="muted">Nessuna causale</td></tr>`}</tbody></table></div>`;

PAGINE.sale=async()=>{
 const draw=()=>{const sale=[...new Set([...(S.cfg.sale||[]),...S.tav.map(t=>t.sala).filter(Boolean)])];
  $("#main").innerHTML=hd("Sale","Impostazioni",true)+`<div class="card" style="padding:0"><table><thead><tr><th></th><th>Nome</th><th>Capienza</th><th>Attiva</th><th>Tavoli</th><th>Modifica</th></tr></thead><tbody>${sale.map(s=>`<tr><td style="width:24px"><span class="sw" style="background:${colSala(s)}"></span></td><td>${esc(s)}</td><td>${S.cfg.capSale?.[s]||S.tav.filter(t=>t.sala===s).reduce((a,t)=>a+(+t.posti||0),0)}</td><td>${(S.cfg.sale||[]).includes(s)?"✔":"—"}</td><td>${S.tav.filter(t=>t.sala===s).length}</td><td><button class="btn g" data-s="${esc(s)}">✎</button></td></tr>`).join("")}</tbody></table></div>`;
  const ed=s=>modal(s?"Modifica sala":"Nuova sala",`<label class="l">Nome</label><input class="f" id="sN" value="${esc(s||"")}" ${s?"disabled":""}><label class="l">Capienza</label><input class="f" id="sC" type="number" value="${S.cfg.capSale?.[s]||""}"><label class="l">Colore</label><input type="color" id="sK" value="${colSala(s||"x")}"><label style="display:block;margin-top:10px"><input type="checkbox" id="sA" ${!s||(S.cfg.sale||[]).includes(s)?"checked":""}> Attiva</label>`,
   async ov=>{const n=s||ov.querySelector("#sN").value.trim();if(!n)return false;const l=(S.cfg.sale||[]).filter(x=>x!==n);if(ov.querySelector("#sA").checked)l.push(n);await salvaCfg({sale:l,capSale:{...(S.cfg.capSale||{}),[n]:+ov.querySelector("#sC").value||0},salaColori:{...(S.cfg.salaColori||{}),[n]:ov.querySelector("#sK").value}});draw();});
  $("#plus").onclick=()=>ed(null);$$("[data-s]").forEach(b=>b.onclick=()=>ed(b.dataset.s));};draw();

PAGINE.tavoli=async()=>{
 const sale=[...new Set([...(S.cfg.sale||[]),...S.tav.map(t=>t.sala).filter(Boolean)])];let fs=sale[0]||"";
 const draw=()=>{const l=S.tav.filter(t=>!fs||t.sala===fs).sort((a,b)=>String(a.nome).localeCompare(String(b.nome),"it",{numeric:true}));
  $("#main").innerHTML=hd("Tavoli","Impostazioni",true)+`<div class="filters"><label class="muted">Sala <select class="pill" id="tS">${sale.map(s=>`<option ${s===fs?"selected":""}>${esc(s)}</option>`).join("")}</select></label><span class="muted">${l.length} tavoli · la posizione sulla piantina si sistema dall'app Sala</span></div>
  <div class="card" style="padding:0"><table><thead><tr><th>Numero</th><th>Sala</th><th>Posti min</th><th>Posti max</th><th>Forma</th><th>Modifica</th></tr></thead><tbody>${l.map(t=>`<tr><td><b>${esc(t.nome)}</b></td><td>${esc(t.sala||"")}</td><td>${t.postiMin||""}</td><td>${t.posti||""}</td><td>${esc(t.forma||"")}</td><td><button class="btn g" data-t="${t.id}">✎</button></td></tr>`).join("")}</tbody></table></div>`;
  $("#tS").onchange=e=>{fs=e.target.value;draw();};
  const ed=t=>modal(t?"Modifica tavolo":"Nuovo tavolo",`<div class="grid g2"><div><label class="l">Numero / nome</label><input class="f" id="eN" value="${esc(t?.nome||"")}"></div><div><label class="l">Sala</label><select class="f" id="eS">${sale.map(s=>`<option ${s===(t?.sala||fs)?"selected":""}>${esc(s)}</option>`).join("")}</select></div>
   <div><label class="l">Posti minimi</label><input class="f" id="eMi" type="number" value="${t?.postiMin||2}"></div><div><label class="l">Posti massimi</label><input class="f" id="eMa" type="number" value="${t?.posti||4}"></div>
   <div><label class="l">Forma</label><select class="f" id="eF">${["quadrato","tondo","orizzontale","verticale","rettangolare","rett_verticale","rombo"].map(f=>`<option ${f===t?.forma?"selected":""}>${f}</option>`).join("")}</select></div></div>${t?`<button class="btn r" id="eDel" style="margin-top:12px">Elimina tavolo</button>`:""}`,
   async ov=>{const d={nome:ov.querySelector("#eN").value.trim(),sala:ov.querySelector("#eS").value,postiMin:+ov.querySelector("#eMi").value||1,posti:+ov.querySelector("#eMa").value||1,forma:ov.querySelector("#eF").value};if(!d.nome)return false;
    if(t){await updateDoc(doc(db,"tavoli",t.id),d);Object.assign(t,d);}else{const r=await addDoc(collection(db,"tavoli"),{...d,w:11,h:16,x:5,y:5});S.tav.push({id:r.id,...d});}toast("Tavolo salvato");draw();});
  $("#plus").onclick=()=>ed(null);$$("[data-t]").forEach(b=>b.onclick=()=>{const t=S.tav.find(x=>x.id===b.dataset.t);const ov=ed(t);ov.querySelector("#eDel").onclick=async()=>{if(!confirm("Eliminare il tavolo "+t.nome+"?"))return;await deleteDoc(doc(db,"tavoli",t.id));S.tav=S.tav.filter(x=>x!==t);ov.remove();draw();};});};draw();
};

PAGINE.importaPien=async()=>{
 const nt=PIEN.sale.reduce((a,s)=>a+s.tavoli.length,0);
 $("#main").innerHTML=hd("Importa da Pienissimo","Impostazioni")+`<div class="card"><p>Copia in Penelope la configurazione letta da Pienissimo il 24/11/2026:</p><ul>${PIEN.sale.map(s=>`<li><span class="chip" style="background:${s.col}">${s.nome}</span> capienza ${s.cap}, ${s.tavoli.length} tavoli</li>`).join("")}<li>${PIEN.causali.length} causali</li></ul>
  <p class="muted">I tavoli già presenti con lo stesso nome nella stessa sala vengono aggiornati (posti e forma) senza perdere la posizione sulla piantina; quelli mancanti vengono aggiunti. Le altre impostazioni non cambiano.</p><button class="btn v" id="iGo">Importa ${nt} tavoli, 3 sale e ${PIEN.causali.length} causali</button><div id="iR" class="muted" style="margin-top:10px"></div></div>`;
 $("#iGo").onclick=async()=>{if(!isAdmin())return toast("Solo l'amministratore");$("#iGo").disabled=true;
  try{await salvaCfg({sale:PIEN.sale.map(s=>s.nome),capSale:Object.fromEntries(PIEN.sale.map(s=>[s.nome,s.cap])),salaColori:Object.fromEntries(PIEN.sale.map(s=>[s.nome,s.col])),causali:[...new Set([...PIEN.causali,...(S.cfg.causali||[])])]});
   let b=writeBatch(db),n=0,ag=0,nu=0;
   for(const s of PIEN.sale){let i=0;for(const t of s.tavoli){const ex=S.tav.find(x=>x.sala===s.nome&&String(x.nome)===t.nome);const d={nome:t.nome,sala:s.nome,postiMin:t.min,posti:t.max,forma:t.forma};
    if(ex){b.update(doc(db,"tavoli",ex.id),d);Object.assign(ex,d);ag++;}else{const r=doc(collection(db,"tavoli"));const c=i%8,rr=Math.floor(i/8);b.set(r,{...d,w:9,h:12,x:2+c*12,y:4+rr*18});S.tav.push({id:r.id,...d});nu++;}i++;n++;if(n%400===0){await b.commit();b=writeBatch(db);}}}
   await b.commit();$("#iR").textContent=`Fatto: ${nu} tavoli aggiunti, ${ag} aggiornati.`;toast("Importazione completata");}catch(e){$("#iR").textContent="Errore: "+(e.code||e.message);$("#iGo").disabled=false;}};
};

/* --- STATISTICHE --- */
PAGINE.trend=async()=>{
 $("#main").innerHTML=hd("Trend","Statistiche")+`<div class="card" id="g1"></div><div class="card" id="g2"></div>`;graficoAnno("#g1");
 const y=new Date().getFullYear();const s=await getDocs(query(P(),where("data",">=",`${y}-01-01`),where("data","<=",`${y}-12-31`))).catch(()=>null);const m={};(s?s.docs:[]).forEach(d=>{const x=d.data();if(!["arrivato","confermata"].includes(x.stato))return;const k=x.causale||"(senza causale)";m[k]=(m[k]||0)+(+x.persone||0);});
 $("#g2").innerHTML=`<b>Presenze ${y} per causale</b><table style="margin-top:8px">${Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join("")||'<tr><td class="muted">Nessun dato</td></tr>'}</table>`;
};
