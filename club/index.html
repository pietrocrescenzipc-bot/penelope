<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galleon Club · Back office</title><meta name="theme-color" content="#0F1B2D"><link rel="icon" href="icona.svg">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F1B2D;--ink2:#1A2B45;--gold:#E0B252;--gold2:#F6E7C4;--bg:#F6F5F1;--card:#fff;--txt:#141C2A;--mute:#737B8C;--line:#E9E6DE;--ok:#1F9D63;--okb:#E3F5EC;--ko:#D6453D;--kob:#FBE9E7;--warn:#D98A1B;--warnb:#FDF1DD;--blu:#2E63E6;--blub:#E8EEFD}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 "Plus Jakarta Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.hidden{display:none!important}a{color:var(--blu)}
#app{display:flex;min-height:100vh}
nav{width:236px;flex:0 0 236px;background:var(--ink);color:#B9C3D3;padding:20px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
nav .brand{display:flex;gap:10px;align-items:center;padding:0 8px 22px}nav .brand i{width:38px;height:38px;border-radius:11px;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:17px}
nav .brand b{color:#fff;display:block;font-size:16px;letter-spacing:.3px}nav .brand small{font-size:11px;color:#7D8AA0}
nav button{display:flex;align-items:center;gap:11px;border:0;background:none;color:inherit;padding:11px 12px;border-radius:10px;font-weight:600;text-align:left}
nav button:hover{background:#ffffff0d}nav button.on{background:var(--ink2);color:#fff;box-shadow:inset 3px 0 var(--gold)}
nav .n{margin-left:auto;background:var(--ko);color:#fff;border-radius:9px;font-size:11px;padding:1px 7px}
nav .me{margin-top:auto;padding:12px;border-top:1px solid #ffffff14;font-size:12.5px}nav .me b{color:#fff;display:block}nav .me button{padding:6px 0;font-size:12.5px}
main{flex:1;min-width:0;padding:26px 32px 70px}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}.hd h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-.3px}.hd .sp{flex:1}.hd .sub{color:var(--mute);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.kpi small{color:var(--mute);font-weight:600;font-size:12.5px;display:block}.kpi b{display:block;font-size:30px;font-weight:800;margin:4px 0 0;letter-spacing:-.5px}.kpi i{font-style:normal;font-size:12px;color:var(--mute)}
.btn{border:0;border-radius:11px;padding:10px 16px;font-weight:700;background:var(--ink);color:#fff;white-space:nowrap}.btn.gold{background:var(--gold);color:var(--ink)}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--txt)}.btn.red{background:var(--ko)}.btn.ok{background:var(--ok)}.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}.btn:disabled{opacity:.45;cursor:default}
.f{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}textarea.f{min-height:90px;resize:vertical}
label.l{display:block;font-size:12px;font-weight:700;color:#4A5262;margin:12px 0 5px}
.srch{flex:1;min-width:260px;border:1px solid var(--line);border-radius:12px;padding:12px 15px;background:#fff;font-size:15px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font-weight:600;font-size:13px}.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
table{width:100%;border-collapse:collapse}th{font-size:12px;color:var(--mute);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}td{padding:11px 10px;border-bottom:1px solid #F2EFE8;vertical-align:middle}
tr.cl:hover td{background:#FBFAF6;cursor:pointer}tr.sel td{background:#FFF7E6}
.bdg{display:inline-block;border-radius:7px;padding:2px 8px;font-size:11.5px;font-weight:700}.b-ok{background:var(--okb);color:var(--ok)}.b-ko{background:var(--kob);color:var(--ko)}.b-w{background:var(--warnb);color:var(--warn)}.b-b{background:var(--blub);color:var(--blu)}.b-g{background:#EFEDE7;color:#5E6575}
.tag{display:inline-block;background:#F1EEE6;border-radius:7px;padding:3px 8px;font-size:12px;margin:0 4px 4px 0}
.av{width:40px;height:40px;border-radius:50%;background:var(--gold2);color:#8A6418;display:grid;place-items:center;font-weight:800;flex:0 0 40px}
.muted{color:var(--mute);font-size:12.5px}.sez{font-weight:800;font-size:15px;margin:22px 0 10px}
.split{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px -18px 14px;padding:0 18px}.tabs button{border:0;background:none;padding:10px 12px;font-weight:700;color:var(--mute);border-bottom:2px solid transparent}.tabs button.on{color:var(--ink);border-color:var(--gold)}
.cons{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #F2EFE8}.cons:last-child{border:0}.cons div{flex:1}.cons b{display:block}
.sw{position:relative;width:44px;height:26px;flex:0 0 44px}.sw input{opacity:0;width:0;height:0}.sw span{position:absolute;inset:0;background:#D7D3CA;border-radius:20px;transition:.2s}.sw span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.sw input:checked+span{background:var(--ok)}.sw input:checked+span:before{transform:translateX(18px)}.sw input:disabled+span{opacity:.5}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}.tl div{position:relative;padding:0 0 12px}.tl div:before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.ov{position:fixed;inset:0;background:rgba(15,27,45,.5);z-index:30;display:flex;justify-content:center;align-items:flex-start;padding:50px 16px;overflow:auto}
.mod{background:#fff;border-radius:18px;width:100%;max-width:640px;padding:22px 24px}.mod h3{margin:0 0 8px;font-size:19px}.mf{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;z-index:50;font-weight:600}
.bar{height:8px;background:#EEEBE3;border-radius:5px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.note{background:var(--warnb);border:1px solid #F3D9A8;border-radius:12px;padding:12px 14px;color:#7A5410;font-size:13px}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:12px}
#login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#22385A,var(--ink))}
#login form{background:#fff;border-radius:20px;padding:30px;width:350px;display:flex;flex-direction:column;gap:10px}
@media(max-width:900px){#app{flex-direction:column}nav{position:static;width:auto;height:auto;flex-direction:row;overflow-x:auto;padding:10px}nav .brand,nav .me{display:none}main{padding:18px 14px}.split,.g4,.g3,.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="hidden"><form id="lf"><div style="text-align:center"><div style="font-size:30px">⚓</div><h2 style="margin:4px 0 0">Galleon Club</h2><div class="muted">The Galleon Pub &amp; Pizzeria</div></div><input class="f" id="lem" type="email" placeholder="Email" required autocomplete="username"><input class="f" id="lpw" type="password" placeholder="Password" required autocomplete="current-password"><button class="btn gold">Entra</button><div id="lerr" style="color:var(--ko);text-align:center;font-weight:600;font-size:13px"></div></form></div>
<div id="app" class="hidden"><nav id="nav"></nav><main id="main"></main></div>
<div id="root"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, addDoc, deleteDoc, collection, query, where, orderBy, limit, startAfter, getDocs, getCountFromServer, getAggregateFromServer, sum, serverTimestamp, writeBatch, arrayUnion, arrayRemove, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBzpnM1H7Nk99bGqiKoFvJfZfUEhxYt1yI",authDomain:"galleon-club.firebaseapp.com",projectId:"galleon-club",storageBucket:"galleon-club.firebasestorage.app",messagingSenderId:"256580919264",appId:"1:256580919264:web:1639030e273fae781fd585"});
const auth=getAuth(app),db=getFirestore(app);

/* ---------- utilità ---------- */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0"),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,oggi=()=>iso(new Date());
const addG=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d);},fa=n=>addG(oggi(),-n);
const itD=s=>{if(!s)return"—";if(s.toDate)s=iso(s.toDate());s=String(s);return /^\d{4}-\d\d-\d\d/.test(s)?`${s.slice(8,10)}/${s.slice(5,7)}/${s.slice(0,4)}`:s;};
const fmt=n=>Number(n||0).toLocaleString("it-IT");
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const telNorm=t=>{let x=String(t||"").replace(/\D/g,"");if(x.startsWith("00"))x=x.slice(2);if(x.length===10&&x.startsWith("3"))x="39"+x;return x.length>=8?x:"";};
const iniz=n=>String(n||"?").trim().split(/\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase();
const MESI=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const toast=m=>{const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800);};
const cnt=async q=>{try{return (await getCountFromServer(q)).data().count;}catch(e){return null;}};
const C=()=>collection(db,"clienti");
const idxLink=e=>{const u=(String(e?.message||"").match(/https:\/\/console\.firebase\.google\.com\S+/)||[])[0];return u?`Serve un indice del database. <a href="${u}" target="_blank">Crealo con un clic</a> e riprova tra qualche minuto.`:esc(e?.code||e?.message||e);};
function modal(t,html,onOk,ok="Salva",cls="ok"){const ov=document.createElement("div");ov.className="ov";ov.innerHTML=`<div class="mod"><h3>${esc(t)}</h3>${html}<div class="mf"><button class="btn ghost" data-x>${onOk?"Annulla":"Chiudi"}</button>${onOk?`<button class="btn ${cls}" data-ok>${esc(ok)}</button>`:""}</div></div>`;
 $("#root").appendChild(ov);ov.querySelector("[data-x]").onclick=()=>ov.remove();ov.onclick=e=>{if(e.target===ov)ov.remove();};
 if(onOk)ov.querySelector("[data-ok]").onclick=async()=>{const b=ov.querySelector("[data-ok]");b.disabled=true;try{if(await onOk(ov)!==false)ov.remove();}catch(e){toast("Errore: "+(e.code||e.message));}b.disabled=false;};return ov;}
const scarica=(nome,testo,tipo="text/csv")=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([testo],{type:tipo}));a.download=nome;a.click();};
const csvTxt=r=>"﻿"+r.map(x=>x.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(";")).join("\n");
const log=(azione,dett={})=>addDoc(collection(db,"registro"),{azione,...dett,da:S.me?.nome||S.me?.uid||"",daUid:S.me?.uid||"",il:serverTimestamp(),app:"galleon-club"}).catch(()=>{});

/* ---------- stato ---------- */
const S={me:null,cfg:{}};const isAdmin=()=>S.me?.ruolo==="admin";
const RET={inattivoGg:60,conservazioneMesi:24,profilazioneMesi:12};

/* ---------- navigazione ---------- */
const MENU=[["home","📊","Panoramica"],["clienti","👥","Clienti"],["segmenti","🎯","Segmenti"],["promo","🎟️","Promozioni"],["privacy","🛡️","Privacy GDPR"],["staff","🔑","Staff e ruoli"]];
let PAG="home",RICH=0;
function drawNav(){
 $("#nav").innerHTML=`<div class="brand"><i>⚓</i><div><b>Galleon Club</b><small>CRM · Promo · Privacy</small></div></div>`+MENU.filter(m=>m[0]!=="staff"||isAdmin()).map(([k,ic,t])=>`<button data-p="${k}" class="${k===PAG?"on":""}">${ic} ${t}${k==="privacy"&&RICH?`<span class="n">${RICH}</span>`:""}</button>`).join("")+
 `<div class="me"><b>${esc(S.me.nome||"")}</b>${isAdmin()?"Titolare":"Sala"}<br><button id="esci" style="border:0;background:none;color:#B9C3D3">Esci</button></div>`;
 $$("#nav [data-p]").forEach(b=>b.onclick=()=>vai(b.dataset.p));$("#esci").onclick=()=>signOut(auth);
}
function vai(p){PAG=p;if(location.hash.slice(1)!==p)location.hash=p;drawNav();$("#main").innerHTML=`<div class="muted">Caricamento…</div>`;(P[p]||P.home)().catch(e=>{$("#main").innerHTML=`<div class="card">${idxLink(e)}</div>`;});}
window.addEventListener("hashchange",()=>{const p=location.hash.slice(1);if(p&&p!==PAG&&P[p])vai(p);});

$("#lf").onsubmit=async e=>{e.preventDefault();$("#lerr").textContent="";try{await signInWithEmailAndPassword(auth,$("#lem").value,$("#lpw").value);}catch(x){$("#lerr").textContent="Email o password errate";}};
onAuthStateChanged(auth,async u=>{
 if(!u){$("#login").classList.remove("hidden");$("#app").classList.add("hidden");return;}
 const sd=await getDoc(doc(db,"staff",u.uid)).catch(()=>null);if(!sd||!sd.exists()){$("#lerr").textContent="Account non abilitato. Chiedi al titolare.";signOut(auth);return;}
 S.me={uid:u.uid,...sd.data()};const c=await getDoc(doc(db,"impostazioni","locale")).catch(()=>null);S.cfg=c&&c.exists()?c.data():{};
 const g=await getDoc(doc(db,"impostazioni","gdpr")).catch(()=>null);if(g&&g.exists())Object.assign(RET,g.data().ret||{});
 if(S.cfg.marketing?.inattiviGg)RET.inattivoGg=S.cfg.marketing.inattiviGg;
 $("#login").classList.add("hidden");$("#app").classList.remove("hidden");
 if(isAdmin())RICH=await cnt(query(collection(db,"richiesteGdpr"),where("stato","==","aperta")))||0;
 const p=location.hash.slice(1);vai(P[p]?p:"home");
});
const P={};

/* ---------- PANORAMICA ---------- */
P.home=async()=>{
 const g=fa(RET.inattivoGg);
 $("#main").innerHTML=`<div class="hd"><h1>Ciao ${esc((S.me.nome||"").split(" ")[0])} 👋</h1><span class="sp"></span><span class="sub">${new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"})}</span></div>
 <div class="grid g4" id="k1">${["Clienti in archivio","Consenso marketing","Attivi ultimi "+RET.inattivoGg+" gg","Nuovi ultimi 30 gg"].map(t=>`<div class="card kpi"><small>${t}</small><b>…</b><i>&nbsp;</i></div>`).join("")}</div>
 <div class="grid g2" style="margin-top:14px"><div class="card"><h3 style="margin:0 0 4px">Salute del database</h3><div class="muted">Quanto è completo e utilizzabile il tuo archivio</div><div id="k2" style="margin-top:12px">…</div></div>
 <div class="card"><h3 style="margin:0 0 4px">Promo con QR – ultimi 30 giorni</h3><div class="muted">Coupon scaricati e usati in sala</div><div id="k3" style="margin-top:12px">…</div></div></div>
 <div class="card" style="margin-top:14px" id="k4"></div>`;
 const tot=await cnt(C())||0;
 const [mkt,att,nuovi,prof,email,mai]=await Promise.all([cnt(query(C(),where("consensi.marketing","==",true))),cnt(query(C(),where("ultimaPresenza",">=",g))),cnt(query(C(),where("dataRegistrazione",">=",fa(30)))),cnt(query(C(),where("consensi.profilazione","==",true))),cnt(query(C(),where("email",">","")) ),cnt(query(C(),where("presenze","==",0)))]);
 const pc=n=>tot&&n!==null?Math.round(n/tot*100):0;
 $("#k1").innerHTML=[["Clienti in archivio",tot,""],["Consenso marketing",mkt,pc(mkt)+"% raggiungibili con le promo"],["Attivi ultimi "+RET.inattivoGg+" gg",att,pc(att)+"% del totale"],["Nuovi ultimi 30 gg",nuovi,""]].map(([t,v,s])=>`<div class="card kpi"><small>${t}</small><b>${v===null?"—":fmt(v)}</b><i>${s||"&nbsp;"}</i></div>`).join("");
 const riga=(t,n,col="var(--ok)")=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between"><span>${t}</span><b>${n===null?"—":fmt(n)} <span class="muted">(${pc(n)}%)</span></b></div><div class="bar"><i style="width:${pc(n)}%;background:${col}"></i></div></div>`;
 $("#k2").innerHTML=riga("Consenso marketing",mkt)+riga("Consenso profilazione",prof,"var(--blu)")+riga("Con email",email,"var(--gold)")+riga("Mai venuti (solo contatto)",mai,"var(--warn)");
 const qc=w=>query(collection(db,"coupon"),where("creatoIl",">=",Timestamp.fromDate(new Date(Date.now()-30*864e5))),...w);
 const [cs,cu]=await Promise.all([cnt(qc([])),cnt(qc([where("stato","==","usato")]))]);
 $("#k3").innerHTML=`<div class="grid g3"><div class="kpi"><small>Scaricati</small><b>${fmt(cs)}</b></div><div class="kpi"><small>Usati</small><b>${fmt(cu)}</b></div><div class="kpi"><small>Ritorno</small><b>${cs?Math.round(cu/cs*100):0}%</b></div></div><button class="btn ghost sm" style="margin-top:10px" onclick="location.hash='promo'">Vai alle promozioni →</button>`;
 const todo=[];if(isAdmin()&&RICH)todo.push(`<b>${RICH}</b> richieste privacy da evadere (entro 30 giorni per legge) <a href="#privacy">Apri</a>`);
 if(!S.cfg.titolare)todo.push(`Completa i dati del titolare in <a href="#privacy">Privacy GDPR → Impostazioni</a>`);
 $("#k4").innerHTML=`<h3 style="margin:0 0 8px">Da fare</h3>${todo.length?todo.map(t=>`<div style="padding:6px 0">• ${t}</div>`).join(""):`<div class="muted">Tutto in ordine ✓</div>`}`;
};

/* ---------- CLIENTI ---------- */
let IDX=null;
async function caricaIndice(){if(IDX)return IDX;const s=await getDocs(collection(db,"indice")).catch(()=>null);IDX=[];(s?s.docs:[]).forEach(d=>{const v=d.data();(v.r?v.r.split("\n"):(v.nuovi||[])).forEach(r=>{const [id,nome,tel]=r.split("|");if(id)IDX.push({id,nome,tel,k:norm(nome)+" "+String(tel||"").replace(/\D/g,"")});});});return IDX;}
async function cerca(q){await caricaIndice();const p=norm(q).split(/\s+/).filter(Boolean).map(x=>/^\+?\d+$/.test(x)?x.replace(/\D/g,""):x);const m=new Map();IDX.filter(x=>p.every(y=>x.k.includes(y))).forEach(x=>m.set(x.id,x));return [...m.values()];}
const CF={f:"tutti",q:"",pag:[],cur:null,sel:new Set()};
const FILTRI=()=>[["tutti","Tutti",[],[orderBy("dataRegistrazione","desc")]],["mkt","✉️ Marketing sì",[where("consensi.marketing","==",true)],[]],["nomkt","🚫 Marketing no",[where("consensi.marketing","==",false)],[]],["attivi","🟢 Attivi",[where("ultimaPresenza",">=",fa(RET.inattivoGg))],[orderBy("ultimaPresenza","desc")]],["inattivi","💤 Inattivi",[where("ultimaPresenza","<",fa(RET.inattivoGg))],[orderBy("ultimaPresenza","desc")]],["mai","🆕 Mai venuti",[where("presenze","==",0)],[]],["vip","⭐ VIP",[where("tags","array-contains","VIP")],[]],["compl","🎂 Compleanno a "+MESI[new Date().getMonth()],[where("tags","array-contains",MESI[new Date().getMonth()])],[]],["promo","🎟️ Hanno usato promo",[where("tags","array-contains","Promo usata")],[]]];
P.clienti=async()=>{
 $("#main").innerHTML=`<div class="hd"><h1>Clienti</h1><span class="sub" id="cT"></span><span class="sp"></span>${isAdmin()?`<button class="btn ghost" id="cX">⬇ Esporta</button>`:""}<button class="btn gold" id="cN">+ Nuovo cliente</button></div>
 <div style="display:flex;gap:10px"><input class="srch" id="cQ" placeholder="🔎 Cerca per nome, cognome o telefono" value="${esc(CF.q)}"></div>
 <div class="chips">${FILTRI().map(([k,t])=>`<button class="chip ${CF.f===k?"on":""}" data-f="${k}">${t}</button>`).join("")}</div>
 <div class="split"><div><div class="card" style="padding:4px 8px"><table><thead><tr><th>Cliente</th><th>Telefono</th><th>Visite</th><th>Ultima visita</th><th>Consensi</th></tr></thead><tbody id="cB"></tbody></table></div><div class="pager"><button class="btn ghost sm" id="cP">‹</button><span class="muted" id="cG"></span><button class="btn ghost sm" id="cNx">›</button></div></div><div id="cS"><div class="card muted">Seleziona un cliente per aprire la scheda.</div></div></div>`;
 let docs=[];const F=()=>FILTRI().find(x=>x[0]===CF.f);
 const carica=async()=>{const B=$("#cB");B.innerHTML=`<tr><td colspan="5" class="muted">Caricamento…</td></tr>`;

function modifica(c){
 const n=!c;c=c||{nome:"",cognome:"",telefono:"",email:"",dataNascita:"",note:"",consensi:{}};
 modal(n?"Nuovo cliente":"Modifica cliente",`<div class="grid g2"><div><label class="l">Nome *</label><input class="f" id="mN" value="${esc(c.nome)}"></div><div><label class="l">Cognome</label><input class="f" id="mC" value="${esc(c.cognome||"")}"></div></div>

 <label class="l">Note di servizio (allergie, preferenze al tavolo)</label><textarea class="f" id="mO">${esc(c.note||"")}</textarea>
 ${n?`<div class="note" style="margin-top:12px">Prima di salvare: hai dato al cliente l'informativa privacy (link <b>privacy.html</b> o cartello in sala)?</div><label style="display:flex;gap:8px;margin-top:10px"><input type="checkbox" id="mI"> Informativa data al cliente *</label><label style="display:flex;gap:8px;margin-top:6px"><input type="checkbox" id="mM"> Il cliente vuole ricevere offerte (marketing)</label><label style="display:flex;gap:8px;margin-top:6px"><input type="checkbox" id="mF"> Il cliente accetta offerte su misura (profilazione)</label>`:""}`,
 async ov=>{const g=s=>ov.querySelector(s)?.value?.trim()||"";const nome=g("#mN");if(!nome){toast("Inserisci il nome");return false;}
  const d={nome,cognome:g("#mC"),email:g("#mE").toLowerCase()||null,dataNascita:g("#mD")||null,provenienza:g("#mP")||null,note:g("#mO")};

  if(n){const t=telNorm(g("#mT"));if(!t){toast("Cellulare non valido");return false;}if(!ov.querySelector("#mI").checked){toast("Serve l'informativa");return false;}

   const mk=ov.querySelector("#mM").checked,pf=ov.querySelector("#mF").checked;
   Object.assign(d,{telefono:"+"+t,presenze:0,puntiFidelity:0,dataRegistrazione:oggi(),origine:"galleon-club",consensi:{privacy:true,marketing:mk,profilazione:pf},consensiLog:[{data:oggi(),fonte:"inserito da staff",da:S.me.nome||"",marketing:mk,profilazione:pf,versione:"2026-11"}]});
   if(!d.tags)d.tags=[];await setDoc(doc(db,"clienti",id),d);

async function datiInteressato(c){
 const out={cliente:{...c}};delete out.cliente.id;
 try{out.prenotazioni=(await getDocs(query(collection(db,"prenotazioni"),where("clienteId","==",c.id)))).docs.map(d=>({id:d.id,...d.data()}));}catch(e){out.prenotazioni=[];}
 try{out.coupon=c.telefono?(await getDocs(query(collection(db,"coupon"),where("telefono","==",c.telefono)))).docs.map(d=>({id:d.id,...d.data()})):[];}catch(e){out.coupon=[];}
 try{out.eventi=(await getDocs(collection(db,"clienti",c.id,"eventi"))).docs.map(d=>({id:d.id,...d.data()}));}catch(e){out.eventi=[];}
 return out;
}
async function esportaInteressato(c){toast("Raccolgo i dati…");const o=await datiInteressato(c);
 const rep=(k,v)=>v&&typeof v==="object"&&typeof v.toDate==="function"?v.toDate().toISOString():v;
 scarica(`dati-${(c.nome||"cliente").replace(/\W+/g,"_")}-${oggi()}.json`,JSON.stringify({titolare:S.cfg.titolare||"The Galleon Pub & Pizzeria",esportatoIl:new Date().toISOString(),...o},rep,2),"application/json");

async function anonimizza(c,silenzioso){
 if(!silenzioso&&!confirm(`Cancellare i dati personali di ${c.nome} ${c.cognome||""}?\n\nNome, telefono, email, note e tag vengono eliminati. Restano solo numeri anonimi per le statistiche. Non si può annullare.`))return false;
 const b=writeBatch(db);
 b.update(doc(db,"clienti",c.id),{nome:"Cliente",cognome:"anonimo",telefono:null,email:null,dataNascita:null,note:"",tags:[],provenienza:null,consensi:{privacy:false,marketing:false,profilazione:false},consensiLog:[],anonimizzato:true,anonimizzatoIl:oggi()});
 try{(await getDocs(query(collection(db,"prenotazioni"),where("clienteId","==",c.id)))).docs.forEach(d=>b.update(d.ref,{nome:"Cliente anonimo",nomeSolo:"",cognomeSolo:"",telefono:"",email:null,note:""}));}catch(e){}
 if(c.telefono)try{(await getDocs(query(collection(db,"coupon"),where("telefono","==",c.telefono)))).docs.forEach(d=>b.delete(d.ref));}catch(e){}
 await b.commit();
 try{const s=await getDocs(collection(db,"indice"));for(const d of s.docs){const v=d.data();if(v.r&&v.r.includes(c.id+"|"))await updateDoc(d.ref,{r:v.r.split("\n").filter(x=>!x.startsWith(c.id+"|")).join("\n")});if(v.nuovi?.some(x=>x.startsWith(c.id+"|")))await updateDoc(d.ref,{nuovi:v.nuovi.filter(x=>!x.startsWith(c.id+"|"))});}IDX=null;}catch(e){}
 log("anonimizzazione cliente",{cliente:c.id});if(!silenzioso){toast("Dati cancellati");scheda(c.id,"consensi");}return true;
}

   Object.assign(S.cfg,{titolare:g("#iT"),emailPrivacy:g("#iE"),urlCoupon:g("#iU")});Object.assign(RET,ret);log("impostazioni privacy modificate");toast("Salvato");};
 }
};
async function evadi(r){
 let c=null;if(r.clienteId){const s=await getDoc(doc(db,"clienti",r.clienteId)).catch(()=>null);if(s?.exists())c={id:s.id,...s.data()};}
 const az={accesso:"Scarica il file con tutti i suoi dati e invialo al cliente.",portabilita:"Scarica il file (formato JSON leggibile da altri sistemi) e invialo al cliente.",cancellazione:"Anonimizza il cliente: nome, contatti, note, coupon vengono cancellati.",opposizione:"Togli il consenso marketing e profilazione.",rettifica:"Correggi i dati dalla scheda cliente."}[r.tipo];
 const ov=modal("Evadi: "+(TIPI[r.tipo]||r.tipo),`<div><b>${esc(r.nome)}</b> ${esc(r.telefono||"")}</div><div class="muted" style="margin:6px 0 12px">${esc(r.note||"")}</div>${c?`<div class="note">${az}</div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">${r.tipo==="accesso"||r.tipo==="portabilita"?`<button class="btn" id="eX">📦 Scarica dati</button>`:""}${r.tipo==="cancellazione"?`<button class="btn red" id="eD">🗑 Anonimizza ora</button>`:""}${r.tipo==="opposizione"?`<button class="btn" id="eO">🚫 Togli consensi</button>`:""}${r.tipo==="rettifica"?`<button class="btn" id="eR">✎ Apri scheda</button>`:""}</div>`:`<div class="note">Nessun cliente trovato con questo numero: rispondi al richiedente che non abbiamo suoi dati.</div>`}<label class="l">Esito / risposta data</label><textarea class="f" id="eN" style="min-height:60px"></textarea>`,
  async ov=>{await updateDoc(doc(db,"richiesteGdpr",r.id),{stato:"evasa",evasa:oggi(),esito:ov.querySelector("#eN").value.trim(),evasaDa:S.me.nome||""});log("richiesta privacy evasa",{cliente:r.clienteId||r.telefono});RICH=Math.max(0,RICH-1);P.privacy();},"Segna come evasa");
 if(!c)return;
 ov.querySelector("#eX")&&(ov.querySelector("#eX").onclick=()=>esportaInteressato(c));
 ov.querySelector("#eD")&&(ov.querySelector("#eD").onclick=async()=>{if(await anonimizza(c))ov.querySelector("#eN").value="Dati anonimizzati il "+itD(oggi());});
 ov.querySelector("#eO")&&(ov.querySelector("#eO").onclick=async()=>{await updateDoc(doc(db,"clienti",c.id),{"consensi.marketing":false,"consensi.profilazione":false,consensiLog:arrayUnion({data:oggi(),fonte:"opposizione/revoca richiesta",da:S.me.nome||"",marketing:false,profilazione:false})});log("consensi revocati su richiesta",{cliente:c.id});ov.querySelector("#eN").value="Consensi marketing e profilazione revocati il "+itD(oggi());toast("Consensi tolti");});
 ov.querySelector("#eR")&&(ov.querySelector("#eR").onclick=()=>{ov.remove();CF.cur=c.id;vai("clienti");});
}

P.staff=async()=>{
 if(!isAdmin()){vai("home");return;}
 const s=await getDocs(collection(db,"staff"));
 $("#main").innerHTML=`<div class="hd"><h1>Staff e ruoli</h1></div><div class="card"><table><thead><tr><th>Nome</th><th>Ruolo</th><th>Cosa può fare</th></tr></thead><tbody>${s.docs.map(d=>{const u=d.data();return `<tr><td><b>${esc(u.nome||"—")}</b><div class="muted">${esc(u.email||d.id)}</div></td><td><select class="f" style="width:auto" data-u="${d.id}" ${d.id===S.me.uid?"disabled":""}><option value="admin" ${u.ruolo==="admin"?"selected":""}>Titolare</option><option value="sala" ${u.ruolo!=="admin"?"selected":""}>Sala</option></select></td><td class="muted">${u.ruolo==="admin"?"Tutto: promo, esportazioni, privacy, ruoli":"Clienti, prenotazioni, scanner coupon. Niente esportazioni"}</td></tr>`;}).join("")}</tbody></table>
 <div class="muted" style="margin-top:12px">Per aggiungere una persona: creala in Firebase → Authentication con email e password, poi aggiungi il documento in "staff" con il suo UID, nome e ruolo "sala". Il tuo ruolo non si può cambiare da qui per sicurezza.</div></div>`;
 $$("[data-u]").forEach(x=>x.onchange=async()=>{await updateDoc(doc(db,"staff",x.dataset.u),{ruolo:x.value});log("ruolo modificato",{cliente:x.dataset.u,ruolo:x.value});toast("Ruolo aggiornato");P.staff();});
};
